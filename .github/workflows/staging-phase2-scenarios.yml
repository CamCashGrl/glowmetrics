                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Try to insert tip as different user (should fail)
                  const { error: deniedError } = await s16_other.client.from("live_tips").insert([
                    { session_id: sessionId, amount_usd: 99.99, tip_type: "card", event_at: new Date().toISOString() },
                  ]).select();

                  const denied = deniedError && (deniedError.code === "PGRST301" || deniedError.message.toLowerCase().includes("permission"));
                  printResult("Authenticated direct persistence denied", 16, denied, "Permission denied error", denied ? "Correctly denied" : "Unexpected access granted");
                } else {
                  printResult("Authenticated direct persistence denied", 16, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 17: Trusted persistence path succeeds
              // CRITICAL: Service role persistence test
              // ============================================
              const s17 = await createTempTestUser("s17");
              console.log(`\n📝 Created s17 (auth ID: ${s17.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s17.client
                  .from("live_sessions")
                  .insert([{ user_id: s17.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Service role can insert via trusted path (no RLS)
                  const { data: tipData, error: tipError } = await serviceRoleClient.from("live_tips").insert([
                    { session_id: sessionId, amount_usd: 44.44, tip_type: "card", event_at: new Date().toISOString() },
                  ]).select();

                  if (!tipError && tipData && tipData.length > 0) {
                    fixtures.liveTipIds.add(tipData[0].id);
                    const tipInserted = tipData[0].amount_usd === 44.44;
                    printResult("Trusted persistence path succeeds", 17, tipInserted, "Service role can bypass RLS and insert", "Tip successfully persisted via service role");
                  } else {
                    printResult("Trusted persistence path succeeds", 17, false, "Service role insert succeeds", tipError ? tipError.message : "No data returned");
                  }
                } else {
                  printResult("Trusted persistence path succeeds", 17, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              console.log("\n" + "=".repeat(50));
              console.log("Test Results Summary");
              console.log("=".repeat(50));
              let passCount = 0;
              testResults.forEach(result => {
                if (result.passed) passCount++;
                console.log(`${result.status} - Scenario ${result.scenario}`);
              });
              console.log(`\nTotal: ${passCount}/${testResults.length} passed`);

              if (isAnyFailure) {
                console.log("\n❌ Some scenarios failed");
              } else {
                console.log("\n✅ All scenarios passed!");
              }
            } catch (error) {
              console.error(`\n❌ Test execution failed: ${error.message}`);
              isAnyFailure = true;
            }
          }

          async function main() {
            try {
              await runScenarios();
            } finally {
              // Always cleanup, even if tests fail
              try {
                await deleteFixtures();
