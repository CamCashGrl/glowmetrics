name: Phase 2 Staging Verification (17 Scenarios) - CORRECTED

on:
  workflow_dispatch:
    inputs:
      run_scenarios:
        description: 'Run staging test scenarios'
        required: false
        default: 'true'

jobs:
  staging-17-scenarios:
    name: Run 17-Scenario Test Suite
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run Phase 2 Staging Verification (17 Scenarios)
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL || 'http://localhost:3000' }}
        run: |
          echo "Starting Phase 2 Staging Verification (17 Scenarios) - CORRECTED"
          echo "================================================================="
          echo ""
          node - << 'SCRIPT_END'
          const { createClient } = require("@supabase/supabase-js");
          const crypto = require("crypto");

          const SUPABASE_URL = process.env.SUPABASE_STAGING_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_STAGING_ANON_KEY;
          const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_STAGING_SERVICE_ROLE_KEY;
          const STAGING_APP_URL = process.env.STAGING_APP_URL;

          if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !SUPABASE_SERVICE_ROLE_KEY) {
            console.error("ERROR: Staging secrets not configured");
            process.exit(1);
          }

          const RUN_ID = crypto.randomBytes(8).toString("hex");
          console.log(`\n🔧 Test Run ID: ${RUN_ID}`);
          console.log("This ID uniquely identifies all fixtures created in this run.\n");

          const serviceRoleClient = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
          const anonClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          const fixtures = {
            authUserIds: new Set(),
            sessionIds: new Set(),
            liveTipIds: new Set(),
            tipIds: new Set(),
          };

          let testResults = [];
          let isAnyFailure = false;

          function printResult(scenario, number, passed, expected, actual, details = "") {
            const status = passed ? "✅ PASS" : "❌ FAIL";
            console.log(`\nScenario ${number}: ${scenario}`);
            console.log(`${status}`);
            console.log(`Expected: ${expected}`);
            console.log(`Actual: ${actual}`);
            if (details) {
              console.log(`Details: ${details}`);
            }

            testResults.push({ scenario: number, passed, status });
            if (!passed) {
              isAnyFailure = true;
            }
          }

          async function createTempTestUser(suffix) {
            const email = `phase2-${RUN_ID}-${suffix}@staging.local`;
            const password = crypto.randomBytes(24).toString("hex");

            const { data: authData, error: authError } = await serviceRoleClient.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
            });

            if (authError) {
              throw new Error(`Failed to create test user ${suffix}: ${authError.message}`);
            }

            fixtures.authUserIds.add(authData.user.id);

            const userClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: signInData, error: signInError } = await userClient.auth.signInWithPassword({
              email,
              password,
            });

            if (signInError) {
              throw new Error(`Failed to sign in test user ${suffix}: ${signInError.message}`);
            }

            return {
              authUserId: authData.user.id,
              client: userClient,
              sessionToken: signInData.session.access_token,
              email,
            };
          }

          async function deleteFixtures() {
            console.log("\n🧹 Cleaning up test fixtures...");

            try {
              if (fixtures.liveTipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_tips")
                  .delete()
                  .in("id", [...fixtures.liveTipIds]);
                if (error) throw new Error(`Failed to delete live_tips: ${error.message}`);
              }

              if (fixtures.tipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("tips")
                  .delete()
                  .in("id", [...fixtures.tipIds]);
                if (error) throw new Error(`Failed to delete tips: ${error.message}`);
              }

              if (fixtures.sessionIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_sessions")
                  .delete()
                  .in("id", [...fixtures.sessionIds]);
                if (error) throw new Error(`Failed to delete live_sessions: ${error.message}`);
              }

              if (fixtures.authUserIds.size > 0) {
                for (const userId of fixtures.authUserIds) {
                  const { error } = await serviceRoleClient.auth.admin.deleteUser(userId);
                  if (error) throw new Error(`Failed to delete auth user ${userId}: ${error.message}`);
                }
              }

              console.log(`✅ Cleaned up ${fixtures.authUserIds.size} auth users and all related fixtures`);
            } catch (cleanupError) {
              console.error(`❌ Cleanup failed: ${cleanupError.message}`);
              throw cleanupError;
            }
          }

          async function postToLiveTipsApi(bearerToken, payload) {
            const url = `${STAGING_APP_URL}/api/live/tips`;
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${bearerToken}`,
              },
              body: JSON.stringify(payload),
            });
            return response.json();
          }

          async function runScenarios() {
            try {
              // ============================================
              // Scenario 1: Real /api/live/tips ingestion succeeds
              // ============================================
              const s1 = await createTempTestUser("s1");
              console.log(`\n📝 Created s1 (auth ID: ${s1.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const clientEventId = crypto.randomUUID();
                  const apiResponse = await postToLiveTipsApi(s1.sessionToken, {
                    username: "Tipper1",
                    amount: 100,
                    platform: "twitch",
                    detectedAt: new Date().toISOString(),
                    clientEventId: clientEventId,
                  });

                  if (apiResponse.success && !apiResponse.duplicate) {
                    fixtures.liveTipIds.add(apiResponse.live_tip_id);
                    fixtures.tipIds.add(apiResponse.tip_id);

                    const { data: liveRow } = await serviceRoleClient
                      .from("live_tips")
                      .select("id, usd")
                      .eq("id", apiResponse.live_tip_id)
                      .single();
                    const { data: tipRow } = await serviceRoleClient
                      .from("tips")
                      .select("id, usd")
                      .eq("id", apiResponse.tip_id)
                      .single();

                    const bothCreated = liveRow && tipRow && Math.abs(liveRow.usd - 25) < 0.01 && Math.abs(tipRow.usd - 25) < 0.01;
                    printResult("Real /api/live/tips ingestion succeeds", 1, bothCreated, "Both canonical tips and live_tips created", bothCreated ? "Correct" : "Mismatch");
                  } else {
                    printResult("Real /api/live/tips ingestion succeeds", 1, false, "HTTP 200, success=true, duplicate=false", apiResponse.error || "Unexpected response");
                  }
                } else {
                  printResult("Real /api/live/tips ingestion succeeds", 1, false, "Session created", sessionError?.message || "Unexpected response");
                }
              }

              // ============================================
              // Scenario 2: Duplicate retry deduplication via clientEventId
              // ============================================
              const s2 = await createTempTestUser("s2");
              console.log(`\n📝 Created s2 (auth ID: ${s2.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s2.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const clientEventId = crypto.randomUUID();
                  const payload = {
                    username: "Tipper2",
                    amount: 50,
                    platform: "youtube",
                    detectedAt: new Date().toISOString(),
                    clientEventId: clientEventId,
                  };

                  const resp1 = await postToLiveTipsApi(s2.sessionToken, payload);
                  if (resp1.success && !resp1.duplicate) {
                    fixtures.liveTipIds.add(resp1.live_tip_id);
                    fixtures.tipIds.add(resp1.tip_id);

                    const resp2 = await postToLiveTipsApi(s2.sessionToken, payload);
                    const deduped = resp2.success && resp2.duplicate && resp2.live_tip_id === resp1.live_tip_id;
                    printResult("Duplicate retry deduplication via clientEventId", 2, deduped, "Second call returns duplicate=true", deduped ? "Correct" : "No deduplication");
                  } else {
                    printResult("Duplicate retry deduplication via clientEventId", 2, false, "First call succeeds", resp1.error || "Unexpected");
                  }
                } else {
                  printResult("Duplicate retry deduplication via clientEventId", 2, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 3: Two identical amounts, different clientEventIds = two rows
              // ============================================
              const s3 = await createTempTestUser("s3");
              console.log(`\n📝 Created s3 (auth ID: ${s3.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s3.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const resp1 = await postToLiveTipsApi(s3.sessionToken, {
                    username: "TipperA",
                    amount: 200,
                    platform: "kick",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  const resp2 = await postToLiveTipsApi(s3.sessionToken, {
                    username: "TipperA",
                    amount: 200,
                    platform: "kick",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  if (resp1.success && resp2.success && !resp1.duplicate && !resp2.duplicate) {
                    fixtures.liveTipIds.add(resp1.live_tip_id);
                    fixtures.liveTipIds.add(resp2.live_tip_id);
                    fixtures.tipIds.add(resp1.tip_id);
                    fixtures.tipIds.add(resp2.tip_id);

                    const bothCreated = resp1.live_tip_id !== resp2.live_tip_id;
                    printResult("Two identical amounts, different clientEventIds", 3, bothCreated, "Both created as separate rows", bothCreated ? "Correct" : "Merged unexpectedly");
                  } else {
                    printResult("Two identical amounts, different clientEventIds", 3, false, "Both HTTP calls succeed", "One or both failed");
                  }
                } else {
                  printResult("Two identical amounts, different clientEventIds", 3, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 4: Active-session attribution via RPC (DB primitive)
              // ============================================
              const s4 = await createTempTestUser("s4");
              console.log(`\n📝 Created s4 (auth ID: ${s4.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s4.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: rpcResult, error: rpcError } = await serviceRoleClient.rpc("persist_extension_tip", {
                    p_user_id: s4.authUserId,
                    p_client_event_id: crypto.randomUUID(),
                    p_deduplication_key: null,
                    p_username: "TestUser4",
                    p_tokens: 75,
                    p_usd: 15.00,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                  });

                  if (!rpcError && rpcResult && rpcResult.success && rpcResult.live_session_id === sessionId) {
                    fixtures.liveTipIds.add(rpcResult.live_tip_id);
                    fixtures.tipIds.add(rpcResult.tip_id);

                    const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count").eq("id", sessionId).single();
                    const stillActive = session && session.final_tip_count === null;
                    printResult("Active-session attribution via RPC", 4, stillActive, "Session remains active (final_tip_count is null)", stillActive ? "Correct" : "Premature finalization");
                  } else {
                    printResult("Active-session attribution via RPC", 4, false, "RPC succeeds with correct session link", rpcError?.message || "Unexpected");
                  }
                } else {
                  printResult("Active-session attribution via RPC", 4, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 5: Paused-session attribution via HTTP
              // ============================================
              const s5 = await createTempTestUser("s5");
              console.log(`\n📝 Created s5 (auth ID: ${s5.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s5.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s5.client.rpc("pause_live_session", { p_session_id: sessionId });
                  if (!pauseError) {
                    const apiResponse = await postToLiveTipsApi(s5.sessionToken, {
                      username: "Tipper5",
                      amount: 100,
                      platform: "youtube",
                      detectedAt: new Date().toISOString(),
                      clientEventId: crypto.randomUUID(),
                    });

                    if (apiResponse.success) {
                      fixtures.liveTipIds.add(apiResponse.live_tip_id);
                      fixtures.tipIds.add(apiResponse.tip_id);

                      const { data: session } = await serviceRoleClient.from("live_sessions").select("is_paused").eq("id", sessionId).single();
                      const isPaused = session && session.is_paused === true;
                      printResult("Paused-session attribution via HTTP", 5, isPaused, "Tip persisted while paused, session remains paused", isPaused ? "Correct" : "Not paused");
                    } else {
                      printResult("Paused-session attribution via HTTP", 5, false, "HTTP POST succeeds", apiResponse.error || "Unexpected");
                    }
                  } else {
                    printResult("Paused-session attribution via HTTP", 5, false, "Session paused", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Paused-session attribution via HTTP", 5, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 6: Pause/resume duration accounting
              // ============================================
              const s6 = await createTempTestUser("s6");
              console.log(`\n📝 Created s6 (auth ID: ${s6.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s6.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s6.client.rpc("pause_live_session", { p_session_id: sessionId });
                  if (!pauseError) {
                    await new Promise(r => setTimeout(r, 500));
                    const { error: resumeError } = await s6.client.rpc("resume_live_session", { p_session_id: sessionId });
                    if (!resumeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("total_paused_seconds").eq("id", sessionId).single();
                      const hasPauseDuration = session && session.total_paused_seconds > 0;
                      printResult("Pause/resume duration accounting", 6, hasPauseDuration, "total_paused_seconds > 0", `Paused for: ${session?.total_paused_seconds || 0}s`);
                    } else {
                      printResult("Pause/resume duration accounting", 6, false, "Resume succeeds", resumeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Pause/resume duration accounting", 6, false, "Pause succeeds", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Pause/resume duration accounting", 6, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 7: Stop while paused
              // ============================================
              const s7 = await createTempTestUser("s7");
              console.log(`\n📝 Created s7 (auth ID: ${s7.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s7.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s7.client.rpc("pause_live_session", { p_session_id: sessionId });
                  if (!pauseError) {
                    const { error: finalizeError } = await s7.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessionId).single();
                      const isEnded = session && session.status === "ended";
                      printResult("Stop while paused", 7, isEnded, "Session finalized to ended status", `Status: ${session?.status || "unknown"}`);
                    } else {
                      printResult("Stop while paused", 7, false, "Finalize succeeds", finalizeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Stop while paused", 7, false, "Pause succeeds", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Stop while paused", 7, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 8: Final metrics with multiple HTTP tips
              // ============================================
              const s8 = await createTempTestUser("s8");
              console.log(`\n📝 Created s8 (auth ID: ${s8.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s8.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const responses = await Promise.all([
                    postToLiveTipsApi(s8.sessionToken, {
                      username: "Tipper8a",
                      amount: 40,
                      platform: "twitch",
                      detectedAt: new Date().toISOString(),
                      clientEventId: crypto.randomUUID(),
                    }),
                    postToLiveTipsApi(s8.sessionToken, {
                      username: "Tipper8b",
                      amount: 60,
                      platform: "twitch",
                      detectedAt: new Date().toISOString(),
                      clientEventId: crypto.randomUUID(),
                    }),
                    postToLiveTipsApi(s8.sessionToken, {
                      username: "Tipper8c",
                      amount: 30,
                      platform: "twitch",
                      detectedAt: new Date().toISOString(),
                      clientEventId: crypto.randomUUID(),
                    }),
                  ]);

                  if (responses.every(r => r.success && !r.duplicate)) {
                    responses.forEach(r => {
                      fixtures.liveTipIds.add(r.live_tip_id);
                      fixtures.tipIds.add(r.tip_id);
                    });

                    const { error: finalizeError } = await s8.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd,final_max_tip_usd").eq("id", sessionId).single();
                      const metricsCorrect = session && session.final_tip_count === 3 && Math.abs(session.final_total_usd - 32.50) < 0.01 && Math.abs(session.final_max_tip_usd - 15) < 0.01;
                      printResult("Final metrics with multiple HTTP tips", 8, metricsCorrect, "final_tip_count=3, final_total_usd=32.50, final_max_tip_usd=15", metricsCorrect ? "All metrics correct" : "Metrics incorrect");
                    } else {
                      printResult("Final metrics with multiple HTTP tips", 8, false, "Finalize succeeds", finalizeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Final metrics with multiple HTTP tips", 8, false, "All three HTTP calls succeed", "One or more failed");
                  }
                } else {
                  printResult("Final metrics with multiple HTTP tips", 8, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 9: Repeated Stop idempotency
              // ============================================
              const s9 = await createTempTestUser("s9");
              console.log(`\n📝 Created s9 (auth ID: ${s9.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s9.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: stop1 } = await s9.client.rpc("finalize_live_session", { p_session_id: sessionId });
                  const { error: stop2 } = await s9.client.rpc("finalize_live_session", { p_session_id: sessionId });

                  const isIdempotent = !stop1 && !stop2;
                  printResult("Repeated Stop idempotency", 9, isIdempotent, "Both finalizations succeed", isIdempotent ? "Idempotent" : "Second finalize failed");
                } else {
                  printResult("Repeated Stop idempotency", 9, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 10: Zero-tip session
              // ============================================
              const s10 = await createTempTestUser("s10");
              console.log(`\n📝 Created s10 (auth ID: ${s10.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s10.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: finalizeError } = await s10.client.rpc("finalize_live_session", { p_session_id: sessionId });
                  if (!finalizeError) {
                    const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd").eq("id", sessionId).single();
                    const zeroMetrics = session && session.final_tip_count === 0 && session.final_total_usd === 0;
                    printResult("Zero-tip session", 10, zeroMetrics, "final_tip_count=0, final_total_usd=0", zeroMetrics ? "Correct" : "Metrics incorrect");
                  } else {
                    printResult("Zero-tip session", 10, false, "Finalize succeeds", finalizeError?.message || "Unexpected");
                  }
                } else {
                  printResult("Zero-tip session", 10, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 11: One-tip session via HTTP
              // ============================================
              const s11 = await createTempTestUser("s11");
              console.log(`\n📝 Created s11 (auth ID: ${s11.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s11.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const apiResponse = await postToLiveTipsApi(s11.sessionToken, {
                    username: "Tipper11",
                    amount: 130,
                    platform: "kick",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  if (apiResponse.success && !apiResponse.duplicate) {
                    fixtures.liveTipIds.add(apiResponse.live_tip_id);
                    fixtures.tipIds.add(apiResponse.tip_id);

                    const { error: finalizeError } = await s11.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd,final_max_tip_usd").eq("id", sessionId).single();
                      const oneMetrics = session && session.final_tip_count === 1 && Math.abs(session.final_total_usd - 33.33) < 0.01;
                      printResult("One-tip session via HTTP", 11, oneMetrics, "final_tip_count=1, final_total_usd≈33.33", oneMetrics ? "Correct" : "Metrics incorrect");
                    } else {
                      printResult("One-tip session via HTTP", 11, false, "Finalize succeeds", finalizeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("One-tip session via HTTP", 11, false, "HTTP POST succeeds", apiResponse.error || "Unexpected");
                  }
                } else {
