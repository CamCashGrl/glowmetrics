name: Phase 2 Staging Verification (17 Scenarios) - CORRECTED

on:
  workflow_dispatch:
    inputs:
      run_scenarios:
        description: 'Run staging test scenarios'
        required: false
        default: 'true'

jobs:
  staging-17-scenarios:
    name: Run 17-Scenario Test Suite
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run Phase 2 Staging Verification (17 Scenarios)
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          echo "Starting Phase 2 Staging Verification (17 Scenarios)"
          echo "================================================================="
          echo ""
          node - << 'SCRIPT_END'
          const { createClient } = require("@supabase/supabase-js");
          const crypto = require("crypto");

          const SUPABASE_URL = process.env.SUPABASE_STAGING_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_STAGING_ANON_KEY;
          const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_STAGING_SERVICE_ROLE_KEY;
          const STAGING_APP_URL = process.env.STAGING_APP_URL;

          if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !SUPABASE_SERVICE_ROLE_KEY) {
            console.error("ERROR: Staging secrets not configured");
            process.exit(1);
          }

          // STAGING_APP_URL is REQUIRED - no localhost fallback
          if (!STAGING_APP_URL) {
            console.error("ERROR: STAGING_APP_URL secret is required for HTTP ingestion scenarios");
            process.exit(1);
          }

          const RUN_ID = crypto.randomBytes(8).toString("hex");
          console.log(`\n🔧 Test Run ID: ${RUN_ID}`);
          console.log("This ID uniquely identifies all fixtures created in this run.\n");

          const serviceRoleClient = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
          const anonClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          const fixtures = {
            authUserIds: new Set(),
            sessionIds: new Set(),
            liveTipIds: new Set(),
            tipIds: new Set(),
          };

          let testResults = [];
          let isAnyFailure = false;

          function printResult(scenario, number, passed, expected, actual, details = "") {
            const status = passed ? "✅ PASS" : "❌ FAIL";
            console.log(`\nScenario ${number}: ${scenario}`);
            console.log(`${status}`);
            console.log(`Expected: ${expected}`);
            console.log(`Actual: ${actual}`);
            if (details) {
              console.log(`Details: ${details}`);
            }

            testResults.push({ scenario: number, passed, status });
            if (!passed) {
              isAnyFailure = true;
            }
          }

          async function createTempTestUser(suffix) {
            const email = `phase2-${RUN_ID}-${suffix}@staging.local`;
            const password = crypto.randomBytes(24).toString("hex");

            const { data: authData, error: authError } = await serviceRoleClient.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
            });

            if (authError) {
              throw new Error(`Failed to create test user ${suffix}: ${authError.message}`);
            }

            fixtures.authUserIds.add(authData.user.id);

            const userClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: signInData, error: signInError } = await userClient.auth.signInWithPassword({
              email,
              password,
            });

            if (signInError) {
              throw new Error(`Failed to sign in test user ${suffix}: ${signInError.message}`);
            }

            return {
              authUserId: authData.user.id,
              client: userClient,
              sessionToken: signInData.session.access_token,
              email,
            };
          }

          async function deleteFixtures() {
            console.log("\n🧹 Cleaning up test fixtures...");

            try {
              if (fixtures.liveTipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_tips")
                  .delete()
                  .in("id", [...fixtures.liveTipIds]);
                if (error) throw new Error(`Failed to delete live_tips: ${error.message}`);
              }

              if (fixtures.tipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("tips")
                  .delete()
                  .in("id", [...fixtures.tipIds]);
                if (error) throw new Error(`Failed to delete tips: ${error.message}`);
              }

              if (fixtures.sessionIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_sessions")
                  .delete()
                  .in("id", [...fixtures.sessionIds]);
                if (error) throw new Error(`Failed to delete live_sessions: ${error.message}`);
              }

              if (fixtures.authUserIds.size > 0) {
                for (const userId of fixtures.authUserIds) {
                  const { error } = await serviceRoleClient.auth.admin.deleteUser(userId);
                  if (error) throw new Error(`Failed to delete auth user ${userId}: ${error.message}`);
                }
              }

              console.log(`✅ Cleaned up ${fixtures.authUserIds.size} auth users and all related fixtures`);
            } catch (cleanupError) {
              console.error(`❌ Cleanup failed: ${cleanupError.message}`);
              throw cleanupError;
            }
          }

          async function postToLiveTipsApi(bearerToken, payload) {
            const url = `${STAGING_APP_URL}/api/live/tips`;
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${bearerToken}`,
              },
              body: JSON.stringify(payload),
            });
            const body = await response.json();
            return {
              status: response.status,
              body: body,
            };
          }

          async function runScenarios() {
            try {
              // ============================================
              // Scenario 1: Real /api/live/tips ingestion succeeds
              // Platform: chaturbate, 100 tokens = $5.00
              // ============================================
              const s1 = await createTempTestUser("s1");
              console.log(`\n📝 Created s1 (auth ID: ${s1.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const clientEventId = crypto.randomUUID();
                  const apiResponse = await postToLiveTipsApi(s1.sessionToken, {
                    username: "Tipper1",
                    amount: 100,
                    platform: "chaturbate",
                    detectedAt: new Date().toISOString(),
                    clientEventId: clientEventId,
                  });

                  if (apiResponse.status === 200 && apiResponse.body.success && !apiResponse.body.duplicate) {
                    fixtures.liveTipIds.add(apiResponse.body.live_tip_id);
                    fixtures.tipIds.add(apiResponse.body.tip_id);

                    const { data: liveRow } = await serviceRoleClient
                      .from("live_tips")
                      .select("id, usd")
                      .eq("id", apiResponse.body.live_tip_id)
                      .single();
                    const { data: tipRow } = await serviceRoleClient
                      .from("tips")
                      .select("id, usd")
                      .eq("id", apiResponse.body.tip_id)
                      .single();

                    const bothCreated = liveRow && tipRow && Math.abs(liveRow.usd - 5.00) < 0.01 && Math.abs(tipRow.usd - 5.00) < 0.01;
                    printResult("Real /api/live/tips ingestion succeeds", 1, bothCreated, "Both canonical tips and live_tips created with $5.00 USD", bothCreated ? "Correct" : "Mismatch");
                  } else {
                    printResult("Real /api/live/tips ingestion succeeds", 1, false, "HTTP 200, success=true, duplicate=false", `Status: ${apiResponse.status}, Body: ${JSON.stringify(apiResponse.body)}`);
                  }
                } else {
                  printResult("Real /api/live/tips ingestion succeeds", 1, false, "Session created", sessionError?.message || "Unexpected response");
                }
              }

              // ============================================
              // Scenario 2: Duplicate retry deduplication via clientEventId
              // Platform: bongacams, 100 tokens = $2.50
              // ============================================
              const s2 = await createTempTestUser("s2");
              console.log(`\n📝 Created s2 (auth ID: ${s2.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s2.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const clientEventId = crypto.randomUUID();
                  const payload = {
                    username: "Tipper2",
                    amount: 100,
                    platform: "bongacams",
                    detectedAt: new Date().toISOString(),
                    clientEventId: clientEventId,
                  };

                  const resp1 = await postToLiveTipsApi(s2.sessionToken, payload);
                  if (resp1.status === 200 && resp1.body.success && !resp1.body.duplicate) {
                    fixtures.liveTipIds.add(resp1.body.live_tip_id);
                    fixtures.tipIds.add(resp1.body.tip_id);

                    const resp2 = await postToLiveTipsApi(s2.sessionToken, payload);
                    const deduped = resp2.status === 200 && resp2.body.success && resp2.body.duplicate && resp2.body.live_tip_id === resp1.body.live_tip_id;
                    printResult("Duplicate retry deduplication via clientEventId", 2, deduped, "Second call returns duplicate=true with same live_tip_id", deduped ? "Correct" : "No deduplication");
                  } else {
                    printResult("Duplicate retry deduplication via clientEventId", 2, false, "First call succeeds", `Status: ${resp1.status}, Body: ${JSON.stringify(resp1.body)}`);
                  }
                } else {
                  printResult("Duplicate retry deduplication via clientEventId", 2, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 3: Two identical amounts, different clientEventIds = two rows
              // Platform: chaturbate, 500 tokens = $25.00
              // ============================================
              const s3 = await createTempTestUser("s3");
              console.log(`\n📝 Created s3 (auth ID: ${s3.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s3.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const resp1 = await postToLiveTipsApi(s3.sessionToken, {
                    username: "TipperA",
                    amount: 500,
                    platform: "chaturbate",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  const resp2 = await postToLiveTipsApi(s3.sessionToken, {
                    username: "TipperA",
                    amount: 500,
                    platform: "chaturbate",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  if (resp1.status === 200 && resp2.status === 200 && resp1.body.success && resp2.body.success && !resp1.body.duplicate && !resp2.body.duplicate) {
                    fixtures.liveTipIds.add(resp1.body.live_tip_id);
                    fixtures.liveTipIds.add(resp2.body.live_tip_id);
                    fixtures.tipIds.add(resp1.body.tip_id);
                    fixtures.tipIds.add(resp2.body.tip_id);

                    const bothCreated = resp1.body.live_tip_id !== resp2.body.live_tip_id;
                    printResult("Two identical amounts, different clientEventIds", 3, bothCreated, "Both created as separate rows", bothCreated ? "Correct" : "Merged unexpectedly");
                  } else {
                    printResult("Two identical amounts, different clientEventIds", 3, false, "Both HTTP calls succeed", "One or both failed");
                  }
                } else {
                  printResult("Two identical amounts, different clientEventIds", 3, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 4: Active-session attribution via RPC (DB primitive)
              // Platform: chaturbate, 250 tokens = $12.50
              // ============================================
              const s4 = await createTempTestUser("s4");
              console.log(`\n📝 Created s4 (auth ID: ${s4.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s4.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: rpcResult, error: rpcError } = await serviceRoleClient.rpc("persist_extension_tip", {
                    p_user_id: s4.authUserId,
                    p_client_event_id: crypto.randomUUID(),
                    p_deduplication_key: null,
                    p_username: "TestUser4",
                    p_tokens: 250,
                    p_usd: 12.50,
                    p_platform: "chaturbate",
                    p_event_at: new Date().toISOString(),
                  });

                  if (!rpcError && rpcResult && rpcResult.success && rpcResult.live_session_id === sessionId) {
                    fixtures.liveTipIds.add(rpcResult.live_tip_id);
                    fixtures.tipIds.add(rpcResult.tip_id);

                    const { data: session } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessionId).single();
                    const stillActive = session && session.status === "active";
                    printResult("Active-session attribution via RPC", 4, stillActive, "Session remains active", stillActive ? "Correct" : "Premature finalization");
                  } else {
                    printResult("Active-session attribution via RPC", 4, false, "RPC succeeds with correct session link", rpcError?.message || "Unexpected");
                  }
                } else {
                  printResult("Active-session attribution via RPC", 4, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 5: Paused-session attribution via HTTP
              // Platform: myfreecams, 200 tokens = $10.00
              // ============================================
              const s5 = await createTempTestUser("s5");
              console.log(`\n📝 Created s5 (auth ID: ${s5.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s5.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s5.client.rpc("pause_live_session");
                  if (!pauseError) {
                    const apiResponse = await postToLiveTipsApi(s5.sessionToken, {
                      username: "Tipper5",
                      amount: 200,
                      platform: "myfreecams",
                      detectedAt: new Date().toISOString(),
                      clientEventId: crypto.randomUUID(),
                    });

                    if (apiResponse.status === 200 && apiResponse.body.success) {
                      fixtures.liveTipIds.add(apiResponse.body.live_tip_id);
                      fixtures.tipIds.add(apiResponse.body.tip_id);

                      const { data: session } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessionId).single();
                      const isPaused = session && session.status === "paused";
                      printResult("Paused-session attribution via HTTP", 5, isPaused, "Tip persisted while paused, session remains paused", isPaused ? "Correct" : "Status changed");
                    } else {
                      printResult("Paused-session attribution via HTTP", 5, false, "HTTP POST succeeds", `Status: ${apiResponse.status}`);
                    }
                  } else {
                    printResult("Paused-session attribution via HTTP", 5, false, "Session paused", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Paused-session attribution via HTTP", 5, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 6: Resume paused session via RPC
              // ============================================
              const s6 = await createTempTestUser("s6");
              console.log(`\n📝 Created s6 (auth ID: ${s6.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s6.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s6.client.rpc("pause_live_session");
                  if (!pauseError) {
                    const { error: resumeError } = await s6.client.rpc("resume_live_session");
                    if (!resumeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessionId).single();
                      const isActive = session && session.status === "active";
                      printResult("Resume paused session via RPC", 6, isActive, "Session resumed to active", isActive ? "Correct" : "Not active");
                    } else {
                      printResult("Resume paused session via RPC", 6, false, "Resume succeeds", resumeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Resume paused session via RPC", 6, false, "Pause succeeds", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Resume paused session via RPC", 6, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 7: Stop session while paused (includes pause duration)
              // ============================================
              const s7 = await createTempTestUser("s7");
              console.log(`\n📝 Created s7 (auth ID: ${s7.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s7.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s7.client.rpc("pause_live_session");
                  if (!pauseError) {
                    await new Promise(resolve => setTimeout(resolve, 500));

                    const { data: stopResult, error: stopError } = await s7.client.rpc("stop_live_session");
                    if (!stopError && stopResult) {
                      const isEnded = stopResult.status === "ended" && stopResult.session_resolution_type === "normal_stop";
                      const hasPauseDuration = stopResult.total_paused_seconds >= 0;
                      const bothTrue = isEnded && hasPauseDuration;
                      printResult("Stop session while paused (includes pause duration)", 7, bothTrue, "Session ended with pause duration included", bothTrue ? "Correct" : "Status or duration issue");
                    } else {
                      printResult("Stop session while paused (includes pause duration)", 7, false, "Stop succeeds", stopError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Stop session while paused (includes pause duration)", 7, false, "Pause succeeds", pauseError?.message || "Unexpected");
                  }
                } else {
                  printResult("Stop session while paused (includes pause duration)", 7, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 8: Multiple tips via HTTP to active session
              // Platform: stripchat, 1000 tokens = $50.00 total (two tips)
              // ============================================
              const s8 = await createTempTestUser("s8");
              console.log(`\n📝 Created s8 (auth ID: ${s8.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s8.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const resp1 = await postToLiveTipsApi(s8.sessionToken, {
                    username: "Tipper8a",
                    amount: 500,
                    platform: "stripchat",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  const resp2 = await postToLiveTipsApi(s8.sessionToken, {
                    username: "Tipper8b",
                    amount: 500,
                    platform: "stripchat",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  if (resp1.status === 200 && resp2.status === 200 && resp1.body.success && resp2.body.success) {
                    fixtures.liveTipIds.add(resp1.body.live_tip_id);
                    fixtures.liveTipIds.add(resp2.body.live_tip_id);
                    fixtures.tipIds.add(resp1.body.tip_id);
                    fixtures.tipIds.add(resp2.body.tip_id);

                    const twoCreated = resp1.body.live_tip_id !== resp2.body.live_tip_id;
                    printResult("Multiple tips via HTTP to active session", 8, twoCreated, "Two distinct tips created", twoCreated ? "Correct" : "Not distinct");
                  } else {
                    printResult("Multiple tips via HTTP to active session", 8, false, "Both HTTP calls succeed", "One or both failed");
                  }
                } else {
                  printResult("Multiple tips via HTTP to active session", 8, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 9: Repeated stop_live_session() is idempotent
              // ============================================
              const s9 = await createTempTestUser("s9");
              console.log(`\n📝 Created s9 (auth ID: ${s9.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s9.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: stop1, error: err1 } = await s9.client.rpc("stop_live_session");
                  const { data: stop2, error: err2 } = await s9.client.rpc("stop_live_session");

                  if (!err1 && stop1 && stop1.status === "ended") {
                    const secondIsNull = !err2 && stop2 === null;
                    printResult("Repeated stop_live_session() is idempotent", 9, secondIsNull, "First succeeds, second returns null", secondIsNull ? "Correct" : "Second did not return null");
                  } else {
                    printResult("Repeated stop_live_session() is idempotent", 9, false, "First stop succeeds", err1?.message || "Unexpected");
                  }
                } else {
                  printResult("Repeated stop_live_session() is idempotent", 9, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 10: Pause then resume then stop calculates metrics
              // Platform: camsoda, 250 tokens = $12.50
              // ============================================
              const s10 = await createTempTestUser("s10");
              console.log(`\n📝 Created s10 (auth ID: ${s10.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s10.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const apiResponse = await postToLiveTipsApi(s10.sessionToken, {
                    username: "Tipper10",
                    amount: 250,
                    platform: "camsoda",
                    detectedAt: new Date().toISOString(),
                    clientEventId: crypto.randomUUID(),
                  });

                  if (apiResponse.status === 200 && apiResponse.body.success) {
                    fixtures.liveTipIds.add(apiResponse.body.live_tip_id);
                    fixtures.tipIds.add(apiResponse.body.tip_id);

                    const { error: pauseError } = await s10.client.rpc("pause_live_session");
                    const { error: resumeError } = await s10.client.rpc("resume_live_session");

                    if (!pauseError && !resumeError) {
                      const { data: stopResult, error: stopError } = await s10.client.rpc("stop_live_session");
                      if (!stopError && stopResult) {
                        const hasMetrics = stopResult.tip_count === 1 && Math.abs(stopResult.session_earnings_usd - 12.50) < 0.01;
                        printResult("Pause then resume then stop calculates metrics", 10, hasMetrics, "Stopped session has tip_count=1 and earnings=$12.50", hasMetrics ? "Correct" : "Metrics mismatch");
                      } else {
                        printResult("Pause then resume then stop calculates metrics", 10, false, "Stop succeeds", stopError?.message || "Unexpected");
                      }
                    } else {
                      printResult("Pause then resume then stop calculates metrics", 10, false, "Pause/resume succeeds", pauseError?.message || resumeError?.message || "Unexpected");
                    }
                  } else {
                    printResult("Pause then resume then stop calculates metrics", 10, false, "Tip persists", `Status: ${apiResponse.status}`);
                  }
                } else {
                  printResult("Pause then resume then stop calculates metrics", 10, false, "Session created", sessionError?.message || "Unexpected");
                }
              }

              // ============================================
              // Scenario 11: Multiple unique tippers counted correctly
              // Platform: chaturbate, 500 tokens per tipper = $25.00 each, 2 tippers
              // ============================================
              const s11 = await createTempTestUser("s11");
              console.log(`\n📝 Created s11 (auth ID: ${s11.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert([{ user_id: s11.authUserId, status: "active" }])
