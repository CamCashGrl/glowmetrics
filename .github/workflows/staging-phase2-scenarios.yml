name: Phase 2 Staging Verification (17 Scenarios)

on:
  workflow_dispatch:
    inputs:
      run_scenarios:
        description: 'Run staging test scenarios'
        required: false
        default: 'true'

jobs:
  staging-17-scenarios:
    name: Run 17-Scenario Test Suite
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run Phase 2 Staging Verification (17 Scenarios)
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting Phase 2 Staging Verification (17 Scenarios)"
          echo "========================================================"
          echo ""
          node - << 'SCRIPT_END'
          const { createClient } = require("@supabase/supabase-js");
          const crypto = require("crypto");

          const SUPABASE_URL = process.env.SUPABASE_STAGING_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_STAGING_ANON_KEY;
          const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_STAGING_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !SUPABASE_SERVICE_ROLE_KEY) {
            console.error("ERROR: Staging secrets not configured");
            process.exit(1);
          }

          // Generate unique run ID for this test execution
          const RUN_ID = crypto.randomBytes(8).toString("hex");
          console.log(`\n🔧 Test Run ID: ${RUN_ID}`);
          console.log("This ID uniquely identifies all fixtures created in this run.\n");

          const serviceRoleClient = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
          const anonClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          // In-memory fixture registry: stores exact IDs of all test-created data
          const fixtures = {
            authUserIds: new Set(),
            sessionIds: new Set(),
            liveTipIds: new Set(),
            tipIds: new Set(),
            clientEventIds: new Set(),
            ambiguityLogIds: new Set(),
          };

          let testResults = [];
          let isAnyFailure = false;

          function printResult(scenario, number, passed, expected, actual, details = "") {
            const status = passed ? "✅ PASS" : "❌ FAIL";
            console.log(`\nScenario ${number}: ${scenario}`);
            console.log(`${status}`);
            console.log(`Expected: ${expected}`);
            console.log(`Actual: ${actual}`);
            if (details) {
              console.log(`Details: ${details}`);
            }

            testResults.push({ scenario: number, passed, status });
            if (!passed) {
              isAnyFailure = true;
            }
          }

          // Create temporary test user and return authenticated client
          async function createTempTestUser(suffix) {
            const email = `phase2-${RUN_ID}-${suffix}@staging.local`;
            const password = crypto.randomBytes(24).toString("hex");

            const { data: authData, error: authError } = await serviceRoleClient.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
            });

            if (authError) {
              throw new Error(`Failed to create test user ${suffix}: ${authError.message}`);
            }

            fixtures.authUserIds.add(authData.user.id);

            // Create authenticated client for this user
            const { data: signInData, error: signInError } = await anonClient.auth.signInWithPassword({
              email,
              password,
            });

            if (signInError) {
              throw new Error(`Failed to sign in test user ${suffix}: ${signInError.message}`);
            }

            const userClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            userClient.auth.session = () => ({
              access_token: signInData.session.access_token,
              user: signInData.user,
            });

            return {
              authUserId: authData.user.id,
              client: userClient,
              email,
            };
          }

          // Delete only exact fixtures tracked by this run (never bulk-delete by user_id)
          async function deleteFixtures() {
            console.log("\n🧹 Cleaning up test fixtures...");

            try {
              // Delete child rows first (foreign key dependencies)
              if (fixtures.clientEventIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("client_events")
                  .delete()
                  .in("id", [...fixtures.clientEventIds]);
                if (error) throw new Error(`Failed to delete client_events: ${error.message}`);
              }

              if (fixtures.ambiguityLogIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("ambiguity_log")
                  .delete()
                  .in("id", [...fixtures.ambiguityLogIds]);
                if (error) throw new Error(`Failed to delete ambiguity_log: ${error.message}`);
              }

              if (fixtures.liveTipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_tips")
                  .delete()
                  .in("id", [...fixtures.liveTipIds]);
                if (error) throw new Error(`Failed to delete live_tips: ${error.message}`);
              }

              if (fixtures.tipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("tips")
                  .delete()
                  .in("id", [...fixtures.tipIds]);
                if (error) throw new Error(`Failed to delete tips: ${error.message}`);
              }

              if (fixtures.sessionIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_sessions")
                  .delete()
                  .in("id", [...fixtures.sessionIds]);
                if (error) throw new Error(`Failed to delete live_sessions: ${error.message}`);
              }

              // Delete auth users last
              if (fixtures.authUserIds.size > 0) {
                for (const userId of fixtures.authUserIds) {
                  const { error } = await serviceRoleClient.auth.admin.deleteUser(userId);
                  if (error) throw new Error(`Failed to delete auth user ${userId}: ${error.message}`);
                }
              }

              console.log(`✅ Cleaned up ${fixtures.authUserIds.size} auth users and all related fixtures`);
            } catch (cleanupError) {
              console.error(`❌ Cleanup failed: ${cleanupError.message}`);
              throw cleanupError;
            }
          }

          async function runScenarios() {
            try {
              // ============================================
              // Scenario 1: Normal tip persistence
              // ============================================
              const s1 = await createTempTestUser("s1");
              console.log(`\n📝 Created s1 (auth ID: ${s1.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s1.client
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const tipData = { session_id: sessionId, amount_usd: 25.00, tip_type: "card", event_at: new Date().toISOString() };
                  const { data: tipResult, error: tipError } = await s1.client
                    .from("live_tips")
                    .insert([tipData])
                    .select();

                  if (!tipError && tipResult && tipResult.length === 1) {
                    fixtures.liveTipIds.add(tipResult[0].id);
                    printResult("Normal tip persistence", 1, tipResult[0].amount_usd === 25.00, "Tip persisted with correct amount", `Amount: ${tipResult[0].amount_usd}`);
                  } else {
                    printResult("Normal tip persistence", 1, false, "Tip persisted", tipError ? tipError.message : "No data returned");
                  }
                } else {
                  printResult("Normal tip persistence", 1, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 2: Duplicate retry dedupe
              // ============================================
              const s2 = await createTempTestUser("s2");
              console.log(`\n📝 Created s2 (auth ID: ${s2.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s2.client
                  .from("live_sessions")
                  .insert([{ user_id: s2.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const clientEventId = crypto.randomUUID();
                  const tipData = { session_id: sessionId, amount_usd: 10.00, tip_type: "cash", client_event_id: clientEventId, event_at: new Date().toISOString() };

                  // First insert
                  const { data: tip1, error: err1 } = await s2.client.from("live_tips").insert([tipData]).select();
                  if (tip1 && tip1.length > 0) {
                    fixtures.liveTipIds.add(tip1[0].id);
                  }

                  // Retry with same client_event_id (should dedupe)
                  const { data: tip2, error: err2 } = await s2.client.from("live_tips").insert([tipData]).select();

                  const deduped = !err2 && (!tip2 || tip2.length === 0);
                  printResult("Duplicate retry dedupe", 2, deduped, "Duplicate rejected/deduped", deduped ? "Retry correctly rejected" : "Unexpected duplicate acceptance");
                } else {
                  printResult("Duplicate retry dedupe", 2, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 3: Two identical tips, different clientEventIds
              // ============================================
              const s3 = await createTempTestUser("s3");
              console.log(`\n📝 Created s3 (auth ID: ${s3.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s3.client
                  .from("live_sessions")
                  .insert([{ user_id: s3.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const tipInserts = [
                    { session_id: sessionId, amount_usd: 50.00, tip_type: "card", client_event_id: crypto.randomUUID(), event_at: new Date().toISOString() },
                    { session_id: sessionId, amount_usd: 50.00, tip_type: "card", client_event_id: crypto.randomUUID(), event_at: new Date().toISOString() },
                  ];

                  const { data: tips, error: tipError } = await s3.client.from("live_tips").insert(tipInserts).select();

                  if (!tipError && tips && tips.length === 2) {
                    tips.forEach(tip => fixtures.liveTipIds.add(tip.id));
                    const bothExist = tips[0].client_event_id !== tips[1].client_event_id && tips[0].amount_usd === tips[1].amount_usd;
                    printResult("Two identical tips, different clientEventIds", 3, bothExist, "Both tips created with different IDs", "Both tips persisted correctly");
                  } else {
                    printResult("Two identical tips, different clientEventIds", 3, false, "2 tips created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Two identical tips, different clientEventIds", 3, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 4: Active-session attribution
              // ============================================
              const s4 = await createTempTestUser("s4");
              console.log(`\n📝 Created s4 (auth ID: ${s4.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s4.client
                  .from("live_sessions")
                  .insert([{ user_id: s4.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s4.client
                    .from("live_tips")
                    .insert([{ session_id: sessionId, amount_usd: 15.00, tip_type: "cash", event_at: new Date().toISOString() }])
                    .select();

                  if (!tipError && tipData && tipData.length === 1) {
                    fixtures.liveTipIds.add(tipData[0].id);
                    const { data: finalSession } = await serviceRoleClient.from("live_sessions").select("final_tip_count").eq("id", sessionId).single();
                    const stillActive = finalSession && finalSession.final_tip_count === null;
                    printResult("Active-session attribution", 4, stillActive, "Session remains active, final_tip_count is null", stillActive ? "Correct" : "Unexpected finalization");
                  } else {
                    printResult("Active-session attribution", 4, false, "Tip inserted", tipError ? tipError.message : "No data");
                  }
                } else {
                  printResult("Active-session attribution", 4, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 5: Paused-session attribution
              // ============================================
              const s5 = await createTempTestUser("s5");
              console.log(`\n📝 Created s5 (auth ID: ${s5.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s5.client
                  .from("live_sessions")
                  .insert([{ user_id: s5.authUserId, status: "paused" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Pause timestamp
                  const pausedAt = new Date();
                  const { error: pauseError } = await s5.client.rpc("pause_live_session", { p_session_id: sessionId });

                  if (!pauseError) {
                    const { data: tipData, error: tipError } = await s5.client
                      .from("live_tips")
                      .insert([{ session_id: sessionId, amount_usd: 20.00, tip_type: "card", event_at: pausedAt.toISOString() }])
                      .select();

                    if (!tipError && tipData && tipData.length === 1) {
                      fixtures.liveTipIds.add(tipData[0].id);
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("is_paused").eq("id", sessionId).single();
                      const isPaused = session && session.is_paused === true;
                      printResult("Paused-session attribution", 5, isPaused, "Tip attributed while paused, session still paused", isPaused ? "Correct" : "Not paused");
                    } else {
                      printResult("Paused-session attribution", 5, false, "Tip inserted while paused", tipError ? tipError.message : "No data");
                    }
                  } else {
                    printResult("Paused-session attribution", 5, false, "Session paused", pauseError.message);
                  }
                } else {
                  printResult("Paused-session attribution", 5, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 6: Pause/resume duration accounting
              // ============================================
              const s6 = await createTempTestUser("s6");
              console.log(`\n📝 Created s6 (auth ID: ${s6.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s6.client
                  .from("live_sessions")
                  .insert([{ user_id: s6.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Pause session
                  const { error: pauseError } = await s6.client.rpc("pause_live_session", { p_session_id: sessionId });
                  if (!pauseError) {
                    await new Promise(r => setTimeout(r, 500)); // Pause for 500ms

                    // Resume session
                    const { error: resumeError } = await s6.client.rpc("resume_live_session", { p_session_id: sessionId });
                    if (!resumeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("total_paused_seconds").eq("id", sessionId).single();
                      const hasPauseDuration = session && session.total_paused_seconds > 0;
                      printResult("Pause/resume duration accounting", 6, hasPauseDuration, "total_paused_seconds > 0", `Paused for: ${session?.total_paused_seconds || 0}s`);
                    } else {
                      printResult("Pause/resume duration accounting", 6, false, "Session resumed", resumeError.message);
                    }
                  } else {
                    printResult("Pause/resume duration accounting", 6, false, "Session paused", pauseError.message);
                  }
                } else {
                  printResult("Pause/resume duration accounting", 6, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 7: Stop while paused
              // ============================================
              const s7 = await createTempTestUser("s7");
              console.log(`\n📝 Created s7 (auth ID: ${s7.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s7.client
                  .from("live_sessions")
                  .insert([{ user_id: s7.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: pauseError } = await s7.client.rpc("pause_live_session", { p_session_id: sessionId });
                  if (!pauseError) {
                    const { error: finalizeError } = await s7.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessionId).single();
                      const isEnded = session && session.status === "ended";
                      printResult("Stop while paused", 7, isEnded, "Session finalized to ended status", `Status: ${session?.status || "unknown"}`);
                    } else {
                      printResult("Stop while paused", 7, false, "Session finalized while paused", finalizeError.message);
                    }
                  } else {
                    printResult("Stop while paused", 7, false, "Session paused", pauseError.message);
                  }
                } else {
                  printResult("Stop while paused", 7, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 8: First Stop final metrics
              // ============================================
              const s8 = await createTempTestUser("s8");
              console.log(`\n📝 Created s8 (auth ID: ${s8.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s8.client
                  .from("live_sessions")
                  .insert([{ user_id: s8.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tips } = await s8.client.from("live_tips").insert([
                    { session_id: sessionId, amount_usd: 10, tip_type: "cash", event_at: new Date().toISOString() },
                    { session_id: sessionId, amount_usd: 15, tip_type: "card", event_at: new Date().toISOString() },
                  ]).select();

                  if (tips && tips.length === 2) {
                    tips.forEach(t => fixtures.liveTipIds.add(t.id));

                    const { error: finalizeError } = await s8.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd,final_max_tip_usd").eq("id", sessionId).single();
                      const metricsCorrect = session && session.final_tip_count === 2 && session.final_total_usd === 25 && session.final_max_tip_usd === 15;
                      printResult("First Stop final metrics", 8, metricsCorrect, "final_tip_count=2, final_total_usd=25, final_max_tip_usd=15", metricsCorrect ? "All metrics correct" : "Metrics incorrect");
                    } else {
                      printResult("First Stop final metrics", 8, false, "Session finalized", finalizeError.message);
                    }
                  } else {
                    printResult("First Stop final metrics", 8, false, "Tips inserted", "Failed to insert tips");
                  }
                } else {
                  printResult("First Stop final metrics", 8, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 9: Repeated Stop idempotency
              // ============================================
              const s9 = await createTempTestUser("s9");
              console.log(`\n📝 Created s9 (auth ID: ${s9.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s9.client
                  .from("live_sessions")
                  .insert([{ user_id: s9.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // First stop
                  const { error: stop1 } = await s9.client.rpc("finalize_live_session", { p_session_id: sessionId });
                  // Second stop (idempotent)
                  const { error: stop2 } = await s9.client.rpc("finalize_live_session", { p_session_id: sessionId });

                  const isIdempotent = !stop1 && !stop2;
                  printResult("Repeated Stop idempotency", 9, isIdempotent, "Both finalizations succeed", isIdempotent ? "Idempotent" : "Second finalize failed");
                } else {
                  printResult("Repeated Stop idempotency", 9, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 10: Zero-tip session
              // ============================================
              const s10 = await createTempTestUser("s10");
              console.log(`\n📝 Created s10 (auth ID: ${s10.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s10.client
                  .from("live_sessions")
                  .insert([{ user_id: s10.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { error: finalizeError } = await s10.client.rpc("finalize_live_session", { p_session_id: sessionId });
                  if (!finalizeError) {
                    const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd").eq("id", sessionId).single();
                    const zeroMetrics = session && session.final_tip_count === 0 && session.final_total_usd === 0;
                    printResult("Zero-tip session", 10, zeroMetrics, "final_tip_count=0, final_total_usd=0", zeroMetrics ? "Correct" : "Metrics incorrect");
                  } else {
                    printResult("Zero-tip session", 10, false, "Session finalized", finalizeError.message);
                  }
                } else {
                  printResult("Zero-tip session", 10, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 11: One-tip session
              // ============================================
              const s11 = await createTempTestUser("s11");
              console.log(`\n📝 Created s11 (auth ID: ${s11.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s11.client
                  .from("live_sessions")
                  .insert([{ user_id: s11.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tips } = await s11.client.from("live_tips").insert([
                    { session_id: sessionId, amount_usd: 33.33, tip_type: "card", event_at: new Date().toISOString() },
                  ]).select();

                  if (tips && tips.length === 1) {
                    fixtures.liveTipIds.add(tips[0].id);

                    const { error: finalizeError } = await s11.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_total_usd,final_max_tip_usd").eq("id", sessionId).single();
                      const oneMetrics = session && session.final_tip_count === 1 && Math.abs(session.final_total_usd - 33.33) < 0.01;
                      printResult("One-tip session", 11, oneMetrics, "final_tip_count=1, final_total_usd≈33.33", oneMetrics ? "Correct" : "Metrics incorrect");
                    } else {
                      printResult("One-tip session", 11, false, "Session finalized", finalizeError.message);
                    }
                  } else {
                    printResult("One-tip session", 11, false, "Tip inserted", "Failed");
                  }
                } else {
                  printResult("One-tip session", 11, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 12: Multiple tippers/top tipper
              // ============================================
              const s12 = await createTempTestUser("s12");
              console.log(`\n📝 Created s12 (auth ID: ${s12.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s12.client
                  .from("live_sessions")
                  .insert([{ user_id: s12.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tips } = await s12.client.from("live_tips").insert([
                    { session_id: sessionId, amount_usd: 5, tip_type: "cash", tipper_name: "Alice", event_at: new Date().toISOString() },
                    { session_id: sessionId, amount_usd: 50, tip_type: "card", tipper_name: "Bob", event_at: new Date().toISOString() },
                    { session_id: sessionId, amount_usd: 10, tip_type: "cash", tipper_name: "Charlie", event_at: new Date().toISOString() },
                  ]).select();

                  if (tips && tips.length === 3) {
                    tips.forEach(t => fixtures.liveTipIds.add(t.id));

                    const { error: finalizeError } = await s12.client.rpc("finalize_live_session", { p_session_id: sessionId });
                    if (!finalizeError) {
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_tip_count,final_top_tipper,final_max_tip_usd").eq("id", sessionId).single();
                      const multiTipper = session && session.final_tip_count === 3 && session.final_top_tipper === "Bob" && session.final_max_tip_usd === 50;
                      printResult("Multiple tippers/top tipper", 12, multiTipper, "final_top_tipper=Bob, final_max_tip_usd=50", multiTipper ? "Correct" : "Metrics incorrect");
                    } else {
                      printResult("Multiple tippers/top tipper", 12, false, "Session finalized", finalizeError.message);
                    }
                  } else {
                    printResult("Multiple tippers/top tipper", 12, false, "Tips inserted", "Failed");
                  }
                } else {
                  printResult("Multiple tippers/top tipper", 12, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 13: Delayed tip reconciliation using immutable event_at
              // ============================================
              const s13 = await createTempTestUser("s13");
              console.log(`\n📝 Created s13 (auth ID: ${s13.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s13.client
                  .from("live_sessions")
                  .insert([{ user_id: s13.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const pastEventTime = new Date(Date.now() - 30000).toISOString();

                  // First stop
                  const { error: stop1 } = await s13.client.rpc("finalize_live_session", { p_session_id: sessionId });
                  if (!stop1) {
                    // Insert tip after finalization (delayed reconciliation)
                    const { data: delayedTip } = await s13.client.from("live_tips").insert([
                      { session_id: sessionId, amount_usd: 7.77, tip_type: "cash", event_at: pastEventTime },
                    ]).select();

                    if (delayedTip && delayedTip.length > 0) {
                      fixtures.liveTipIds.add(delayedTip[0].id);

                      // Check if delayed tip updated finalized metrics
                      const { data: session } = await serviceRoleClient.from("live_sessions").select("final_total_usd").eq("id", sessionId).single();
                      const reconciled = session && Math.abs(session.final_total_usd - 7.77) < 0.01;
                      printResult("Delayed tip reconciliation using immutable event_at", 13, reconciled, "Delayed tip reconciled into final_total_usd", reconciled ? "Correct" : "Not reconciled");
                    } else {
                      printResult("Delayed tip reconciliation using immutable event_at", 13, false, "Delayed tip inserted", "Failed");
                    }
                  } else {
                    printResult("Delayed tip reconciliation using immutable event_at", 13, false, "First finalize succeeded", stop1.message);
                  }
                } else {
                  printResult("Delayed tip reconciliation using immutable event_at", 13, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 14: Ambiguous overlapping ended sessions
              // ============================================
              const s14 = await createTempTestUser("s14");
              console.log(`\n📝 Created s14 (auth ID: ${s14.authUserId})`);

              {
                // Create two sessions that might overlap in finalization
                const { data: sessions } = await s14.client.from("live_sessions").insert([
                  { user_id: s14.authUserId, status: "active" },
                  { user_id: s14.authUserId, status: "active" },
                ]).select();

                if (sessions && sessions.length === 2) {
                  sessions.forEach(s => fixtures.sessionIds.add(s.id));

                  const { error: fin1 } = await s14.client.rpc("finalize_live_session", { p_session_id: sessions[0].id });
                  const { error: fin2 } = await s14.client.rpc("finalize_live_session", { p_session_id: sessions[1].id });

                  if (!fin1 && !fin2) {
                    const { data: s1Status } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessions[0].id).single();
                    const { data: s2Status } = await serviceRoleClient.from("live_sessions").select("status").eq("id", sessions[1].id).single();
                    const bothEnded = s1Status?.status === "ended" && s2Status?.status === "ended";
                    printResult("Ambiguous overlapping ended sessions", 14, bothEnded, "Both sessions finalized to ended", bothEnded ? "Correct" : "Not both ended");
                  } else {
                    printResult("Ambiguous overlapping ended sessions", 14, false, "Both sessions finalized", "One or both failed");
                  }
                } else {
                  printResult("Ambiguous overlapping ended sessions", 14, false, "Two sessions created", "Failed");
                }
              }

              // ============================================
              // Scenario 15: persist_extension_tip() racing with finalize_live_session()
              // CRITICAL: Advisory lock serialization test
              // ============================================
              const s15 = await createTempTestUser("s15");
              console.log(`\n📝 Created s15 (auth ID: ${s15.authUserId})`);

              {
                const { data: sessionData, error: sessionError } = await s15.client
                  .from("live_sessions")
                  .insert([{ user_id: s15.authUserId, status: "active" }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Race: persist tip and finalize concurrently (advisory lock should serialize)
                  const results = await Promise.allSettled([
                    s15.client.from("live_tips").insert([{ session_id: sessionId, amount_usd: 12.50, tip_type: "cash", event_at: new Date().toISOString() }]).select(),
                    s15.client.rpc("finalize_live_session", { p_session_id: sessionId }),
                  ]);

                  if (results.every(r => r.status === "fulfilled")) {
                    const tipResult = results[0].value;
                    if (tipResult.data && tipResult.data.length > 0) {
                      fixtures.liveTipIds.add(tipResult.data[0].id);
                    }

                    const { data: finalSession } = await serviceRoleClient.from("live_sessions").select("status,final_tip_count,final_total_usd").eq("id", sessionId).single();
                    const raceLocked = finalSession && finalSession.status === "ended" && finalSession.final_tip_count === 1 && Math.abs(finalSession.final_total_usd - 12.50) < 0.01;
                    printResult("persist_extension_tip() racing with finalize_live_session()", 15, raceLocked, "Both operations succeed, metrics correct due to advisory lock", raceLocked ? "Lock serialized correctly" : "Metrics incorrect");
                  } else {
                    printResult("persist_extension_tip() racing with finalize_live_session()", 15, false, "Both concurrent operations succeed", "One or both failed");
                  }
                } else {
                  printResult("persist_extension_tip() racing with finalize_live_session()", 15, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 16: Authenticated direct persistence denied
              // CRITICAL: Permission enforcement test
              // ============================================
              const s16 = await createTempTestUser("s16");
