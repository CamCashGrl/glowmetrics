name: Phase 2 Staging Verification (17 Scenarios)

on:
  workflow_dispatch:
    inputs:
      run_scenarios:
        description: 'Run staging test scenarios'
        required: false
        default: 'true'

jobs:
  staging-17-scenarios:
    name: Run 17-Scenario Test Suite
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run Phase 2 Staging Verification (17 Scenarios)
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting Phase 2 Staging Verification (17 Scenarios)"
          echo "========================================================"
          echo ""
          node - << 'SCRIPT_END'
          const { createClient } = require("@supabase/supabase-js");
          const crypto = require("crypto");

          const SUPABASE_URL = process.env.SUPABASE_STAGING_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_STAGING_ANON_KEY;
          const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_STAGING_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !SUPABASE_SERVICE_ROLE_KEY) {
            console.error("ERROR: Staging secrets not configured");
            process.exit(1);
          }

          // Generate unique run ID for this test execution
          const RUN_ID = crypto.randomBytes(8).toString("hex");
          console.log(`\n🔧 Test Run ID: ${RUN_ID}`);
          console.log("This ID uniquely identifies all fixtures created in this run.\n");

          const serviceRoleClient = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
          const anonClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          // In-memory fixture registry: stores exact IDs of all test-created data
          const fixtures = {
            authUserIds: new Set(),
            sessionIds: new Set(),
            liveTipIds: new Set(),
            tipIds: new Set(),
            clientEventIds: new Set(),
            ambiguityLogIds: new Set(),
          };

          let testResults = [];
          let isAnyFailure = false;

          function printResult(scenario, number, passed, expected, actual, details = "") {
            const status = passed ? "✅ PASS" : "❌ FAIL";
            console.log(`\nScenario ${number}: ${scenario}`);
            console.log(`${status}`);
            console.log(`Expected: ${expected}`);
            console.log(`Actual: ${actual}`);
            if (details) {
              console.log(`Details: ${details}`);
            }

            testResults.push({ scenario: number, passed, status });
            if (!passed) {
              isAnyFailure = true;
            }
          }

          // Create temporary test user and return authenticated client
          async function createTempTestUser(suffix) {
            const email = `phase2-${RUN_ID}-${suffix}@staging.local`;
            const password = crypto.randomBytes(24).toString("hex");

            const { data: authData, error: authError } = await serviceRoleClient.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
            });

            if (authError) {
              throw new Error(`Failed to create test user ${suffix}: ${authError.message}`);
            }

            fixtures.authUserIds.add(authData.user.id);

            // Create authenticated client for this user
            const { data: signInData, error: signInError } = await anonClient.auth.signInWithPassword({
              email,
              password,
            });

            if (signInError) {
              throw new Error(`Failed to sign in test user ${suffix}: ${signInError.message}`);
            }

            const userClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            userClient.auth.session = () => ({
              access_token: signInData.session.access_token,
              user: signInData.user,
            });

            return {
              authUserId: authData.user.id,
              client: userClient,
              email,
            };
          }

          // Delete only exact fixtures tracked by this run (never bulk-delete by user_id)
          async function deleteFixtures() {
            console.log("\n🧹 Cleaning up test fixtures...");

            try {
              // Delete child rows first (foreign key dependencies)
              if (fixtures.clientEventIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("client_events")
                  .delete()
                  .in("id", [...fixtures.clientEventIds]);
                if (error) throw new Error(`Failed to delete client_events: ${error.message}`);
              }

              if (fixtures.ambiguityLogIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("ambiguity_log")
                  .delete()
                  .in("id", [...fixtures.ambiguityLogIds]);
                if (error) throw new Error(`Failed to delete ambiguity_log: ${error.message}`);
              }

              if (fixtures.liveTipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_tips")
                  .delete()
                  .in("id", [...fixtures.liveTipIds]);
                if (error) throw new Error(`Failed to delete live_tips: ${error.message}`);
              }

              if (fixtures.tipIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("tips")
                  .delete()
                  .in("id", [...fixtures.tipIds]);
                if (error) throw new Error(`Failed to delete tips: ${error.message}`);
              }

              if (fixtures.sessionIds.size > 0) {
                const { error } = await serviceRoleClient
                  .from("live_sessions")
                  .delete()
                  .in("id", [...fixtures.sessionIds]);
                if (error) throw new Error(`Failed to delete live_sessions: ${error.message}`);
              }

              // Delete auth users last
              if (fixtures.authUserIds.size > 0) {
                for (const userId of fixtures.authUserIds) {
                  const { error } = await serviceRoleClient.auth.admin.deleteUser(userId);
                  if (error) throw new Error(`Failed to delete auth user ${userId}: ${error.message}`);
                }
              }

              console.log(`✅ Cleaned up ${fixtures.authUserIds.size} auth users and all related fixtures`);
            } catch (cleanupError) {
              console.error(`❌ Cleanup failed: ${cleanupError.message}`);
              throw cleanupError;
            }
          }

          async function runScenarios() {
            try {
              // ============================================
              // Scenarios 1-3: Shared temp user (s1)
              // ============================================
              const s1 = await createTempTestUser("s1");
              console.log(`\n📝 Created s1 (auth ID: ${s1.authUserId})`);

              // Scenario 1: Basic session creation
              {
                const { data, error } = await s1.client
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId }])
                  .select();

                if (!error && data && data.length > 0) {
                  fixtures.sessionIds.add(data[0].id);
                  printResult("Basic session creation", 1, true, "Session created", `Session ID: ${data[0].id}`);
                } else {
                  printResult("Basic session creation", 1, false, "Session created", error ? error.message : "No data returned");
                }
              }

              // Scenario 2: Multi-session per user
              {
                const { data, error } = await s1.client
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId }, { user_id: s1.authUserId }])
                  .select();

                if (!error && data && data.length === 2) {
                  data.forEach(session => fixtures.sessionIds.add(session.id));
                  printResult("Multi-session per user", 2, true, "2 sessions created", `Created ${data.length} sessions`);
                } else {
                  printResult("Multi-session per user", 2, false, "2 sessions created", error ? error.message : "Unexpected response");
                }
              }

              // Scenario 3: Session with tips
              {
                const { data: sessionData, error: sessionError } = await s1.client
                  .from("live_sessions")
                  .insert([{ user_id: s1.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s1.client
                    .from("live_tips")
                    .insert([
                      { session_id: sessionId, amount_usd: 10, tip_type: "cash" },
                      { session_id: sessionId, amount_usd: 15, tip_type: "card" },
                    ])
                    .select();

                  if (!tipError && tipData && tipData.length === 2) {
                    tipData.forEach(tip => fixtures.liveTipIds.add(tip.id));
                    const totalUsd = tipData.reduce((sum, tip) => sum + tip.amount_usd, 0);
                    printResult("Session with tips", 3, totalUsd === 25, "Total USD 25", `Total USD: ${totalUsd}`);
                  } else {
                    printResult("Session with tips", 3, false, "2 tips inserted", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Session with tips", 3, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenarios 4-5: Shared temp user (s4)
              // ============================================
              const s4 = await createTempTestUser("s4");
              console.log(`\n📝 Created s4 (auth ID: ${s4.authUserId})`);

              // Scenario 4: Multiple tips in single session
              {
                const { data: sessionData, error: sessionError } = await s4.client
                  .from("live_sessions")
                  .insert([{ user_id: s4.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const tipInserts = Array.from({ length: 5 }, (_, i) => ({
                    session_id: sessionId,
                    amount_usd: (i + 1) * 5,
                    tip_type: i % 2 === 0 ? "cash" : "card",
                  }));

                  const { data: tipData, error: tipError } = await s4.client
                    .from("live_tips")
                    .insert(tipInserts)
                    .select();

                  if (!tipError && tipData && tipData.length === 5) {
                    tipData.forEach(tip => fixtures.liveTipIds.add(tip.id));
                    printResult("Multiple tips in session", 4, true, "5 tips created", `Created ${tipData.length} tips`);
                  } else {
                    printResult("Multiple tips in session", 4, false, "5 tips created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Multiple tips in session", 4, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // Scenario 5: Tip type validation
              {
                const { data: sessionData, error: sessionError } = await s4.client
                  .from("live_sessions")
                  .insert([{ user_id: s4.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s4.client
                    .from("live_tips")
                    .insert([{ session_id: sessionId, amount_usd: 20, tip_type: "card" }])
                    .select();

                  if (!tipError && tipData && tipData.length > 0) {
                    fixtures.liveTipIds.add(tipData[0].id);
                    const isValidType = tipData[0].tip_type === "card";
                    printResult("Tip type validation", 5, isValidType, "tip_type='card'", `tip_type='${tipData[0].tip_type}'`);
                  } else {
                    printResult("Tip type validation", 5, false, "Tip created with type 'card'", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Tip type validation", 5, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 6: Fresh temp user (s6)
              // ============================================
              const s6 = await createTempTestUser("s6");
              console.log(`\n📝 Created s6 (auth ID: ${s6.authUserId})`);

              // Scenario 6: Client event tracking
              {
                const { data: sessionData, error: sessionError } = await s6.client
                  .from("live_sessions")
                  .insert([{ user_id: s6.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: eventData, error: eventError } = await s6.client
                    .from("client_events")
                    .insert([{ session_id: sessionId, event_type: "page_view", event_data: {} }])
                    .select();

                  if (!eventError && eventData && eventData.length > 0) {
                    fixtures.clientEventIds.add(eventData[0].id);
                    printResult("Client event tracking", 6, true, "Event created", `Event ID: ${eventData[0].id}`);
                  } else {
                    printResult("Client event tracking", 6, false, "Event created", eventError ? eventError.message : "Unexpected response");
                  }
                } else {
                  printResult("Client event tracking", 6, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 7: Fresh temp user (s7)
              // ============================================
              const s7 = await createTempTestUser("s7");
              console.log(`\n📝 Created s7 (auth ID: ${s7.authUserId})`);

              // Scenario 7: Ambiguity log creation
              {
                const { data: sessionData, error: sessionError } = await s7.client
                  .from("live_sessions")
                  .insert([{ user_id: s7.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: logData, error: logError } = await s7.client
                    .from("ambiguity_log")
                    .insert([{ session_id: sessionId, ambiguity_type: "low_confidence" }])
                    .select();

                  if (!logError && logData && logData.length > 0) {
                    fixtures.ambiguityLogIds.add(logData[0].id);
                    printResult("Ambiguity log creation", 7, true, "Log entry created", `Log ID: ${logData[0].id}`);
                  } else {
                    printResult("Ambiguity log creation", 7, false, "Log entry created", logError ? logError.message : "Unexpected response");
                  }
                } else {
                  printResult("Ambiguity log creation", 7, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenarios 8-9: Shared temp user (s8)
              // ============================================
              const s8 = await createTempTestUser("s8");
              console.log(`\n📝 Created s8 (auth ID: ${s8.authUserId})`);

              // Scenario 8: Concurrent sessions per user
              {
                const insertPromises = Array.from({ length: 3 }, () => ({
                  user_id: s8.authUserId,
                }));

                const { data, error } = await s8.client
                  .from("live_sessions")
                  .insert(insertPromises)
                  .select();

                if (!error && data && data.length === 3) {
                  data.forEach(session => fixtures.sessionIds.add(session.id));
                  printResult("Concurrent sessions per user", 8, true, "3 concurrent sessions", `Created ${data.length} sessions`);
                } else {
                  printResult("Concurrent sessions per user", 8, false, "3 concurrent sessions", error ? error.message : "Unexpected response");
                }
              }

              // Scenario 9: Session finalization
              {
                const { data: sessionData, error: sessionError } = await s8.client
                  .from("live_sessions")
                  .insert([{ user_id: s8.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s8.client
                    .from("live_tips")
                    .insert([{ session_id: sessionId, amount_usd: 50, tip_type: "cash" }])
                    .select();

                  if (!tipError && tipData && tipData.length > 0) {
                    fixtures.liveTipIds.add(tipData[0].id);

                    // Finalize using authenticated user client
                    const { error: finalizeError } = await s8.client.rpc("finalize_live_session", {
                      p_session_id: sessionId,
                    });

                    if (!finalizeError) {
                      const { data: finalStatus } = await serviceRoleClient
                        .from("live_sessions")
                        .select("status")
                        .eq("id", sessionId)
                        .single();

                      const isEnded = finalStatus && finalStatus.status === "ended";
                      printResult("Session finalization", 9, isEnded, "Session status=ended", `Status: ${finalStatus ? finalStatus.status : "unknown"}`);
                    } else {
                      printResult("Session finalization", 9, false, "Session finalized", finalizeError.message);
                    }
                  } else {
                    printResult("Session finalization", 9, false, "Tip created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Session finalization", 9, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 10: Fresh temp user (s10)
              // ============================================
              const s10 = await createTempTestUser("s10");
              console.log(`\n📝 Created s10 (auth ID: ${s10.authUserId})`);

              // Scenario 10: Large number of tips
              {
                const { data: sessionData, error: sessionError } = await s10.client
                  .from("live_sessions")
                  .insert([{ user_id: s10.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const tipInserts = Array.from({ length: 50 }, (_, i) => ({
                    session_id: sessionId,
                    amount_usd: Math.random() * 100,
                    tip_type: i % 2 === 0 ? "cash" : "card",
                  }));

                  const { data: tipData, error: tipError } = await s10.client
                    .from("live_tips")
                    .insert(tipInserts)
                    .select();

                  if (!tipError && tipData && tipData.length === 50) {
                    tipData.forEach(tip => fixtures.liveTipIds.add(tip.id));
                    printResult("Large number of tips", 10, true, "50 tips created", `Created ${tipData.length} tips`);
                  } else {
                    printResult("Large number of tips", 10, false, "50 tips created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Large number of tips", 10, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 11: Fresh temp user (s11)
              // ============================================
              const s11 = await createTempTestUser("s11");
              console.log(`\n📝 Created s11 (auth ID: ${s11.authUserId})`);

              // Scenario 11: Tip amount edge cases
              {
                const { data: sessionData, error: sessionError } = await s11.client
                  .from("live_sessions")
                  .insert([{ user_id: s11.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s11.client
                    .from("live_tips")
                    .insert([
                      { session_id: sessionId, amount_usd: 0.01, tip_type: "card" },
                      { session_id: sessionId, amount_usd: 9999.99, tip_type: "cash" },
                    ])
                    .select();

                  if (!tipError && tipData && tipData.length === 2) {
                    tipData.forEach(tip => fixtures.liveTipIds.add(tip.id));
                    const hasMinMax = tipData.some(t => t.amount_usd === 0.01) && tipData.some(t => t.amount_usd === 9999.99);
                    printResult("Tip amount edge cases", 11, hasMinMax, "Min/max amounts stored", "Amounts: 0.01 and 9999.99");
                  } else {
                    printResult("Tip amount edge cases", 11, false, "2 tips created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Tip amount edge cases", 11, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 12: Fresh temp user (s12)
              // ============================================
              const s12 = await createTempTestUser("s12");
              console.log(`\n📝 Created s12 (auth ID: ${s12.authUserId})`);

              // Scenario 12: Session metadata
              {
                const { data: sessionData, error: sessionError } = await s12.client
                  .from("live_sessions")
                  .insert([{ user_id: s12.authUserId, metadata: { device: "mobile", os: "iOS" } }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  fixtures.sessionIds.add(sessionData[0].id);
                  const hasMetadata = sessionData[0].metadata && sessionData[0].metadata.device === "mobile";
                  printResult("Session metadata", 12, hasMetadata, "Metadata stored correctly", `Metadata: ${JSON.stringify(sessionData[0].metadata)}`);
                } else {
                  printResult("Session metadata", 12, false, "Session with metadata created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 13: Fresh temp user (s13)
              // ============================================
              const s13 = await createTempTestUser("s13");
              console.log(`\n📝 Created s13 (auth ID: ${s13.authUserId})`);

              // Scenario 13: Multiple event types
              {
                const { data: sessionData, error: sessionError } = await s13.client
                  .from("live_sessions")
                  .insert([{ user_id: s13.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: eventData, error: eventError } = await s13.client
                    .from("client_events")
                    .insert([
                      { session_id: sessionId, event_type: "page_view", event_data: {} },
                      { session_id: sessionId, event_type: "button_click", event_data: { button: "submit" } },
                      { session_id: sessionId, event_type: "form_submit", event_data: {} },
                    ])
                    .select();

                  if (!eventError && eventData && eventData.length === 3) {
                    eventData.forEach(event => fixtures.clientEventIds.add(event.id));
                    const eventTypes = new Set(eventData.map(e => e.event_type));
                    const hasAllTypes = eventTypes.size === 3;
                    printResult("Multiple event types", 13, hasAllTypes, "3 different event types", `Event types: ${[...eventTypes].join(", ")}`);
                  } else {
                    printResult("Multiple event types", 13, false, "3 events created", eventError ? eventError.message : "Unexpected response");
                  }
                } else {
                  printResult("Multiple event types", 13, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 14: Fresh temp user (s14)
              // ============================================
              const s14 = await createTempTestUser("s14");
              console.log(`\n📝 Created s14 (auth ID: ${s14.authUserId})`);

              // Scenario 14: Tip retrieval and aggregation
              {
                const { data: sessionData, error: sessionError } = await s14.client
                  .from("live_sessions")
                  .insert([{ user_id: s14.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s14.client
                    .from("live_tips")
                    .insert([
                      { session_id: sessionId, amount_usd: 5, tip_type: "cash" },
                      { session_id: sessionId, amount_usd: 10, tip_type: "card" },
                      { session_id: sessionId, amount_usd: 15, tip_type: "cash" },
                    ])
                    .select();

                  if (!tipError && tipData && tipData.length === 3) {
                    tipData.forEach(tip => fixtures.liveTipIds.add(tip.id));

                    const totalUsd = tipData.reduce((sum, tip) => sum + tip.amount_usd, 0);
                    const cashTotal = tipData.filter(t => t.tip_type === "cash").reduce((sum, t) => sum + t.amount_usd, 0);

                    const isCorrectTotal = totalUsd === 30 && cashTotal === 20;
                    printResult("Tip retrieval and aggregation", 14, isCorrectTotal, "Total 30, Cash 20", `Total: ${totalUsd}, Cash: ${cashTotal}`);
                  } else {
                    printResult("Tip retrieval and aggregation", 14, false, "3 tips created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Tip retrieval and aggregation", 14, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 15: Fresh temp user (s15)
              // CRITICAL: Advisory lock serialization test
              // ============================================
              const s15 = await createTempTestUser("s15");
              console.log(`\n📝 Created s15 (auth ID: ${s15.authUserId})`);

              // Scenario 15: Advisory lock serialization
              {
                const { data: sessionData, error: sessionError } = await s15.client
                  .from("live_sessions")
                  .insert([{ user_id: s15.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  const { data: tipData, error: tipError } = await s15.client
                    .from("live_tips")
                    .insert([{ session_id: sessionId, amount_usd: 25.00, tip_type: "card" }])
                    .select();

                  if (!tipError && tipData && tipData.length > 0) {
                    fixtures.liveTipIds.add(tipData[0].id);

                    // Attempt concurrent finalization (advisory lock should serialize)
                    const results = await Promise.allSettled([
                      s15.client.rpc("finalize_live_session", { p_session_id: sessionId }),
                      s15.client.rpc("finalize_live_session", { p_session_id: sessionId }),
                    ]);

                    // At least one should succeed
                    const anySuccess = results.some(r => r.status === "fulfilled" && !r.value.error);

                    if (anySuccess) {
                      // Verify final state: session ended, exactly 1 tip, total_usd = 25.00
                      const { data: finalSession } = await serviceRoleClient
                        .from("live_sessions")
                        .select("status, final_tip_count, final_total_usd")
                        .eq("id", sessionId)
                        .single();

                      if (finalSession) {
                        const isCorrectState =
                          finalSession.status === "ended" &&
                          finalSession.final_tip_count === 1 &&
                          finalSession.final_total_usd === 25.00;

                        printResult(
                          "Advisory lock serialization",
                          15,
                          isCorrectState,
                          "Status=ended, final_tip_count=1, final_total_usd=25.00",
                          `Status=${finalSession.status}, final_tip_count=${finalSession.final_tip_count}, final_total_usd=${finalSession.final_total_usd}`
                        );
                      } else {
                        printResult("Advisory lock serialization", 15, false, "Session finalized with correct metrics", "Could not retrieve final session state");
                      }
                    } else {
                      printResult("Advisory lock serialization", 15, false, "At least one finalize succeeded", "All attempts failed or errored");
                    }
                  } else {
                    printResult("Advisory lock serialization", 15, false, "Tip created", tipError ? tipError.message : "Unexpected response");
                  }
                } else {
                  printResult("Advisory lock serialization", 15, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 16: Fresh temp user (s16)
              // CRITICAL: Permission denied test
              // ============================================
              const s16 = await createTempTestUser("s16");
              console.log(`\n📝 Created s16 (auth ID: ${s16.authUserId})`);

              // Scenario 16: RLS permission enforcement
              {
                const { data: sessionData, error: sessionError } = await s16.client
                  .from("live_sessions")
                  .insert([{ user_id: s16.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Try to access another user's session (will be blocked by RLS)
                  const { data: otherSession, error: otherError } = await s16.client
                    .from("live_sessions")
                    .select()
                    .eq("user_id", s1.authUserId)
                    .single();

                  // Should get permission denied error
                  const isPermissionDenied =
                    otherError &&
                    (otherError.code === "PGRST301" || otherError.message.toLowerCase().includes("permission") || otherError.message.toLowerCase().includes("denied"));

                  printResult(
                    "RLS permission enforcement",
                    16,
                    isPermissionDenied,
                    "Permission denied error",
                    otherError ? `Error: ${otherError.code} - ${otherError.message}` : "No error (unexpected)"
                  );
                } else {
                  printResult("RLS permission enforcement", 16, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              // ============================================
              // Scenario 17: Fresh temp user (s17)
              // CRITICAL: Service role bypass test
              // ============================================
              const s17 = await createTempTestUser("s17");
              console.log(`\n📝 Created s17 (auth ID: ${s17.authUserId})`);

              // Scenario 17: Service role capability
              {
                const { data: sessionData, error: sessionError } = await s17.client
                  .from("live_sessions")
                  .insert([{ user_id: s17.authUserId }])
                  .select();

                if (!sessionError && sessionData && sessionData.length > 0) {
                  const sessionId = sessionData[0].id;
                  fixtures.sessionIds.add(sessionId);

                  // Service role can access any session (no RLS)
                  const { data: anySession, error: anyError } = await serviceRoleClient
                    .from("live_sessions")
                    .select()
                    .eq("user_id", s1.authUserId)
                    .single();

                  const canAccessOtherUser = !anyError && anySession;
                  printResult(
                    "Service role capability",
                    17,
                    canAccessOtherUser,
                    "Service role can access any session",
                    anyError ? `Error: ${anyError.message}` : "Successfully accessed other user's session"
                  );
                } else {
                  printResult("Service role capability", 17, false, "Session created", sessionError ? sessionError.message : "Unexpected response");
                }
              }

              console.log("\n" + "=".repeat(50));
              console.log("Test Results Summary");
              console.log("=".repeat(50));
              let passCount = 0;
              testResults.forEach(result => {
                if (result.passed) passCount++;
                console.log(`${result.status} - Scenario ${result.scenario}`);
              });
              console.log(`\nTotal: ${passCount}/${testResults.length} passed`);

              if (isAnyFailure) {
                console.log("\n❌ Some scenarios failed");
              } else {
                console.log("\n✅ All scenarios passed!");
              }
            } catch (error) {
              console.error(`\n❌ Test execution failed: ${error.message}`);
              isAnyFailure = true;
            }
          }

          async function main() {
            try {
              await runScenarios();
            } finally {
              // Always cleanup, even if tests fail
              try {
                await deleteFixtures();
              } catch (cleanupError) {
                console.error(`Cleanup error: ${cleanupError.message}`);
                process.exit(1);
              }
            }

            if (isAnyFailure) {
              process.exit(1);
            }
          }

          main().catch(err => {
            console.error(`Fatal error: ${err.message}`);
            process.exit(1);
          });

          SCRIPT_END
