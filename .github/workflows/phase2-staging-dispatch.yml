name: Phase 2 Staging Dispatch

on:
  push:
    branches:
      - claude/intelligent-volta-gplyme
    paths:
      - '.github/workflows/phase2-staging-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full staging verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run phase2-staging-verification.yml --ref claude/intelligent-volta-gplyme
