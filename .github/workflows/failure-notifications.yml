name: Test Failure Notifications
on:
  workflow_run:
    workflows: ["Daily Test Suite Execution", "Test Integrity Guard", "Production Health Check"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  notify-on-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, Windows, camcash-test]
    timeout-minutes: 5
    steps:
      # Only workflow-definition code, never the completed PR's head revision.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download optional results from the completed run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-${{ github.event.workflow_run.id }}
          path: notification-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Create GitHub failure issue
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${process.env.FAILED_WORKFLOW} failed`,
              body: `Branch: ${process.env.FAILED_BRANCH}\nWorkflow: ${process.env.FAILED_RUN_URL}\nInspect the actual failure and available artifacts before deployment.`,
              labels: ['test-failure', 'urgent'],
            });
      - name: Notify Slack of actual failure
        shell: pwsh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_SECRET }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_RESULTS_PATH: notification-results/test-results/results.json
        run: node scripts/ci/notify-slack.cjs
