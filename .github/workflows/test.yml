name: CamCash Test Suite
on:
  push:
    branches: ['claude/*', main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    environment: camcash-test
    env:
      CI: 'true'
      CAMCASH_TEST_ENV: 'true'
      # Existing date fixtures/fingerprints assume UTC, as on hosted Linux.
      # Creator-local behavior is tested with explicit IANA timezone arguments.
      TZ: UTC
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_STAGING_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject production before installing or testing
        run: node scripts/ci/assert-test-environment.cjs
      - name: Install locked dependencies
        working-directory: glowmetrics_fresh
        run: npm ci
      - name: Safety and integrity regression tests
        run: node --test scripts/ci/__tests__/safety-and-integrity.test.cjs
      - name: Verify changed test files
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/ci/verify-test-integrity.cjs "$env:CI_BASE_REF"
      - name: Verify hourly-rate formulas
        working-directory: glowmetrics_fresh
        run: node scripts/verify-estimated-hourly-rate.mjs
      - name: Verify timezone rules
        working-directory: glowmetrics_fresh
        run: node scripts/check-timezone.mjs
      - name: Run all analytics, API and UI tests once
        working-directory: glowmetrics_fresh
        run: |
          node -e "require('node:fs').mkdirSync('test-results', { recursive: true })"
          npm run test:ci -- --runInBand
      - name: Verify test counts, failures and skips from Jest JSON
        if: always()
        run: node scripts/ci/verify-test-integrity.cjs --results glowmetrics_fresh/test-results/results.json
      - name: Generate factual report
        if: always()
        run: node scripts/test-reporter.mjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            glowmetrics_fresh/test-results/
            glowmetrics_fresh/coverage/
          retention-days: 3
          if-no-files-found: warn
