name: CamCash Test Suite

on:
  push:
    branches:
      - claude/*
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (all, api, ui, formulas)'
        required: false
        default: 'all'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./glowmetrics_fresh
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./glowmetrics_fresh
        run: npm run test:ci
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate test report
        if: always()
        working-directory: ./glowmetrics_fresh
        run: npm run test:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: glowmetrics_fresh/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: glowmetrics_fresh/coverage/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = JSON.parse(fs.readFileSync('./glowmetrics_fresh/test-results/summary.json', 'utf8'));

            const message = `## Test Results

            - **Tests Passed**: ${testResults.numPassedTests}/${testResults.numTotalTests}
            - **Suites Passed**: ${testResults.numPassedTestSuites}/${testResults.numTotalTestSuites}
            - **Coverage**: ${testResults.coverage.lines}% lines
            - **Duration**: ${(testResults.testResults.reduce((a, r) => a + r.perfStats.end - r.perfStats.start, 0) / 1000).toFixed(2)}s

            ${testResults.numFailedTests > 0 ? `⚠️ **${testResults.numFailedTests} test(s) failed**` : '✅ All tests passed'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Fail if tests failed
        if: failure()
        run: exit 1
