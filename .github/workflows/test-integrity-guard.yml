name: Test Integrity Guard

on:
  pull_request:
    paths:
      - '**/*.test.js'
      - '**/*.test.ts'
      - '**/*.test.jsx'
      - '**/*.test.tsx'
  push:
    branches:
      - main
    paths:
      - '**/*.test.js'
      - '**/*.test.ts'
      - '**/*.test.jsx'
      - '**/*.test.tsx'

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    name: Verify Test Files Not Manipulated

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check for test file deletions
        run: |
          DELETED=$(git diff origin/main..HEAD --name-status | grep "^D.*\.test\." || true)
          if [ ! -z "$DELETED" ]; then
            echo "❌ Test files cannot be deleted:"
            echo "$DELETED"
            exit 1
          fi
          echo "✅ No test files deleted"

      - name: Check for test skipping patterns
        run: |
          echo "Checking for test.skip, it.skip, describe.skip patterns..."
          SKIPPED=$(git diff origin/main..HEAD | grep -E '^\+.*\.(skip|x)\(' || true)
          if [ ! -z "$SKIPPED" ]; then
            echo "❌ Tests cannot be skipped:"
            echo "$SKIPPED"
            exit 1
          fi
          echo "✅ No skipped tests detected"

      - name: Check for weakened assertions
        run: |
          echo "Checking for weakened assertions..."
          WEAK=$(git diff origin/main..HEAD | grep -E '^\+.*expect\(true\)\.toBe\(true\)' || true)
          if [ ! -z "$WEAK" ]; then
            echo "❌ Tautological assertions detected:"
            echo "$WEAK"
            exit 1
          fi
          echo "✅ No weakened assertions detected"

      - name: Verify test count integrity
        run: |
          cd glowmetrics_fresh
          CURRENT=$(npm test 2>&1 | grep "Tests:" | awk '{print $2}' | cut -d'/' -f2)
          if [ "$CURRENT" -lt 427 ]; then
            echo "❌ Test count decreased from 427 to $CURRENT"
            exit 1
          fi
          echo "✅ Test count maintained at $CURRENT"

      - name: Report success
        if: success()
        run: |
          echo "✅ Test integrity check passed"
          echo "- No tests deleted"
          echo "- No tests skipped"
          echo "- No assertions weakened"
          echo "- Test count maintained"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Test integrity check FAILED"
          echo "All 427 tests must remain active and valid."
          exit 1
