name: Test Integrity Guard
on:
  pull_request:
    paths: ['**/*.test.js', '**/*.test.ts', '**/*.test.jsx', '**/*.test.tsx', 'scripts/ci/**']
  push:
    branches: [main]
    paths: ['**/*.test.js', '**/*.test.ts', '**/*.test.jsx', '**/*.test.tsx', 'scripts/ci/**']
permissions:
  contents: read
jobs:
  integrity-check:
    name: Verify Test Files Not Manipulated
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, Windows, camcash-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject deleted, skipped, focused or tautological tests
        shell: pwsh
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/ci/verify-test-integrity.cjs "$env:CI_BASE_REF"
      # The main suite enforces test totals from its actual Jest JSON, without
      # running an uninstalled/duplicate suite or parsing human console output.
