name: Phase 2 Staging Verification (17 Scenarios)

on:
  workflow_dispatch:
    inputs:
      run_scenarios:
        description: 'Run staging test scenarios'
        required: false
        default: 'true'

  push:
    branches:
      - claude/intelligent-volta-gplyme

jobs:
  staging-17-scenarios:
    name: Run 17-Scenario Test Suite
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run Phase 2 Staging Verification (17 Scenarios)
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting Phase 2 Staging Verification (17 Scenarios)"
          echo "========================================================"
          echo ""
          node - << 'SCRIPT_END'
          const { createClient } = require("@supabase/supabase-js");
          const crypto = require("crypto");

          const SUPABASE_URL = process.env.SUPABASE_STAGING_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_STAGING_ANON_KEY;
          const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_STAGING_SERVICE_ROLE_KEY;

          if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !SUPABASE_SERVICE_ROLE_KEY) {
            console.error("ERROR: Staging secrets not configured");
            process.exit(1);
          }

          const TEST_RUN_ID = crypto.randomUUID();

          function generateUUID() {
            return crypto.randomUUID();
          }

          let testResults = [];
          let isAnyFailure = false;
          let createdAuthUsers = [];

          function printResult(scenario, number, passed, expected, actual, details = "") {
            const status = passed ? "✅ PASS" : "❌ FAIL";
            console.log(`\nScenario ${number}: ${scenario}`);
            console.log(`${status}`);
            console.log(`Expected: ${expected}`);
            console.log(`Actual: ${actual}`);
            if (details) {
              console.log(`Details: ${details}`);
            }

            testResults.push({ scenario: number, passed, status });
            if (!passed) {
              isAnyFailure = true;
            }
          }

          async function createTempAuthUser(client) {
            const RUN_ID = new Date().getTime().toString().slice(-6);
            const tempEmail = `phase2-${RUN_ID}-${crypto.randomBytes(4).toString("hex")}@staging.local`;
            const tempPassword = crypto.randomBytes(24).toString("hex");

            const { data: created, error: createErr } = await client.auth.admin.createUser({
              email: tempEmail,
              password: tempPassword,
              email_confirm: true
            });

            if (createErr) throw new Error(`Failed to create temp auth user: ${createErr.message}`);
            return { userId: created.user.id, email: tempEmail, password: tempPassword };
          }

          async function cleanupTempAuthUser(client, userId) {
            try {
              const { error: deleteErr } = await client.auth.admin.deleteUser(userId);
              if (deleteErr) {
                console.log(`⚠ Warning: Could not delete auth user ${userId}: ${deleteErr.message}`);
              } else {
                console.log(`✓ Deleted auth user ${userId}`);
              }
            } catch (e) {
              console.log(`⚠ Warning: Exception deleting auth user ${userId}: ${e.message}`);
            }
          }

          async function createAuthenticatedClient(tempUser) {
            const authClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { error: signInErr } = await authClient.auth.signInWithPassword({
              email: tempUser.email,
              password: tempUser.password
            });
            if (signInErr) throw new Error(`Failed to sign in temp user: ${signInErr.message}`);
            return authClient;
          }

          async function cleanupUserFixtures(client, userId) {
            let cleanupIssues = [];

            // Delete child rows first (tips, logs), then sessions
            const { error: logErr } = await client.from("unattributed_tips_log").delete().eq("user_id", userId);
            if (logErr && !logErr.message.includes("permission")) {
              cleanupIssues.push(`Failed to delete unattributed_tips_log: ${logErr.message}`);
            }

            const { error: liveErr } = await client.from("live_tips").delete().eq("user_id", userId);
            if (liveErr && !liveErr.message.includes("permission")) {
              cleanupIssues.push(`Failed to delete live_tips: ${liveErr.message}`);
            }

            const { error: tipsErr } = await client.from("tips").delete().eq("user_id", userId);
            if (tipsErr && !tipsErr.message.includes("permission")) {
              cleanupIssues.push(`Failed to delete tips: ${tipsErr.message}`);
            }

            // Delete sessions last
            const { error: sessErr } = await client.from("live_sessions").delete().eq("user_id", userId);
            if (sessErr && !sessErr.message.includes("permission")) {
              cleanupIssues.push(`Failed to delete live_sessions: ${sessErr.message}`);
            }

            if (cleanupIssues.length > 0) {
              console.log(`⚠ Cleanup warnings for user ${userId}:`);
              cleanupIssues.forEach(issue => console.log(`  - ${issue}`));
            } else {
              console.log(`✓ Cleanup complete for user ${userId}`);
            }
          }

          async function runTests() {
            console.log("Phase 2 Staging: 17-Scenario Test Suite (Corrected with Temporary Auth Users)");
            console.log("Testing RPC functions with auth context\n");

            const serviceRoleClient = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
            const anonClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let scenario1SessionId, scenario1TipId, scenario1ClientEventId;
            let scenario4SessionId, scenario5SessionId, scenario6SessionId, scenario7SessionId;
            let scenario8SessionId, scenario9SessionId, scenario10SessionId;
            let scenario11SessionId, scenario12SessionId;
            let scenario13EndedSessionId, scenario14SessionAId, scenario14SessionBId;

            try {
              // ========== SCENARIO 1 ==========
              let s1UserId = null;
              let s1Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s1UserId = tempUser.userId;
                createdAuthUsers.push(s1UserId);

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s1UserId,
                    started_at: new Date(Date.now() - 2 * 60 * 60 * 1000),
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario1SessionId = sessionData[0].id;

                const clientEventId = generateUUID();
                scenario1ClientEventId = clientEventId;

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s1UserId,
                    p_client_event_id: clientEventId,
                    p_deduplication_key: null,
                    p_username: "test_tipper_1",
                    p_tokens: 1000,
                    p_usd: 25.50,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                const passed = tipData.success && !tipData.duplicate && tipData.live_session_id === scenario1SessionId;
                scenario1TipId = tipData.tip_id;

                s1Result.passed = passed;
                s1Result.message = `success=${tipData.success}, duplicate=${tipData.duplicate}`;

                printResult(
                  "Normal active-session tip",
                  1,
                  passed,
                  "success=true, duplicate=false, live_session_id matches",
                  s1Result.message,
                  `session=${scenario1SessionId}`
                );
              } catch (error) {
                s1Result.passed = false;
                s1Result.message = error.message;
                printResult("Normal active-session tip", 1, false, "RPC call succeeds", `Error: ${error.message}`);
              }

              // ========== SCENARIO 2 ==========
              let s2Result = { passed: false, message: "Not executed" };
              try {
                if (!s1UserId || !scenario1ClientEventId) throw new Error("Scenario 1 setup incomplete");

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s1UserId,
                    p_client_event_id: scenario1ClientEventId,
                    p_deduplication_key: null,
                    p_username: "test_tipper_1",
                    p_tokens: 1000,
                    p_usd: 25.50,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                const passed = tipData.success && tipData.duplicate === true;
                s2Result.passed = passed;
                s2Result.message = `success=${tipData.success}, duplicate=${tipData.duplicate}`;

                printResult(
                  "Duplicate retry",
                  2,
                  passed,
                  "success=true, duplicate=true",
                  s2Result.message
                );
              } catch (error) {
                s2Result.passed = false;
                s2Result.message = error.message;
                printResult("Duplicate retry", 2, false, "RPC detects duplicate", `Error: ${error.message}`);
              }

              // ========== SCENARIO 3 ==========
              let s3Result = { passed: false, message: "Not executed" };
              try {
                if (!s1UserId) throw new Error("Scenario 1 setup incomplete");
                const clientEventId2 = generateUUID();

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s1UserId,
                    p_client_event_id: clientEventId2,
                    p_deduplication_key: null,
                    p_username: "test_tipper_1",
                    p_tokens: 500,
                    p_usd: 12.75,
                    p_platform: "twitch",
                    p_event_at: new Date(Date.now() + 1000).toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                const { data: allTips, error: queryError } = await serviceRoleClient
                  .from("live_tips")
                  .select("*")
                  .eq("user_id", s1UserId);

                if (queryError) throw queryError;

                const passed = tipData.success && !tipData.duplicate && allTips.length >= 2;
                s3Result.passed = passed;
                s3Result.message = `Tips count: ${allTips.length}`;

                printResult(
                  "Different clientEventIds count separately",
                  3,
                  passed,
                  "Both tips recorded, count >= 2",
                  s3Result.message
                );
              } catch (error) {
                s3Result.passed = false;
                s3Result.message = error.message;
                printResult("Different clientEventIds", 3, false, "Both tips recorded", `Error: ${error.message}`);
              }

              // Scenarios 1→2→3 cleanup (grouped lifecycle)
              if (s1UserId) {
                await cleanupUserFixtures(serviceRoleClient, s1UserId);
                await cleanupTempAuthUser(serviceRoleClient, s1UserId);
              }

              // ========== SCENARIO 4 ==========
              let s4UserId = null;
              let s4Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s4UserId = tempUser.userId;
                createdAuthUsers.push(s4UserId);

                const clientEventId = generateUUID();

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s4UserId,
                    started_at: new Date(Date.now() - 60 * 60 * 1000),
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario4SessionId = sessionData[0].id;

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s4UserId,
                    p_client_event_id: clientEventId,
                    p_deduplication_key: null,
                    p_username: "active_tipper",
                    p_tokens: 2000,
                    p_usd: 50.00,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                const passed = tipData.live_session_id === scenario4SessionId;
                s4Result.passed = passed;
                s4Result.message = `live_session_id matches: ${passed}`;

                printResult(
                  "Active-session attribution",
                  4,
                  passed,
                  "Tip attributed to active session",
                  s4Result.message
                );
              } catch (error) {
                s4Result.passed = false;
                s4Result.message = error.message;
                printResult("Active-session attribution", 4, false, "Tip attributed", `Error: ${error.message}`);
              }

              // ========== SCENARIO 5 ==========
              let s5Result = { passed: false, message: "Not executed" };
              try {
                if (!s4UserId || !scenario4SessionId) throw new Error("Scenario 4 setup incomplete");
                const clientEventId = generateUUID();

                // Get session state before pause
                const { data: sessionBefore } = await serviceRoleClient
                  .from("live_sessions")
                  .select("*")
                  .eq("id", scenario4SessionId)
                  .single();

                const pauseTime = new Date().toISOString();
                const { error: updateError } = await serviceRoleClient
                  .from("live_sessions")
                  .update({ status: "paused", paused_at: pauseTime })
                  .eq("id", scenario4SessionId);

                if (updateError) throw updateError;

                // Get session state after pause
                const { data: sessionAfter } = await serviceRoleClient
                  .from("live_sessions")
                  .select("*")
                  .eq("id", scenario4SessionId)
                  .single();

                const eventTime = new Date().toISOString();
                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s4UserId,
                    p_client_event_id: clientEventId,
                    p_deduplication_key: null,
                    p_username: "paused_tipper",
                    p_tokens: 500,
                    p_usd: 12.50,
                    p_platform: "twitch",
                    p_event_at: eventTime,
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                console.log(`  S5 DEBUG: RPC returned live_session_id=${tipData.live_session_id}, expected=${scenario4SessionId}`);
                console.log(`  S5 DEBUG: Session state BEFORE pause: started_at=${sessionBefore?.started_at}, paused_at=${sessionBefore?.paused_at}, status=${sessionBefore?.status}`);
                console.log(`  S5 DEBUG: Session state AFTER pause: started_at=${sessionAfter?.started_at}, paused_at=${sessionAfter?.paused_at}, status=${sessionAfter?.status}`);
                console.log(`  S5 DEBUG: Event time=${eventTime}`);
                console.log(`  S5 DEBUG: Full RPC result: ${JSON.stringify(tipData)}`);

                const passed = tipData.live_session_id === scenario4SessionId;
                s5Result.passed = passed;
                s5Result.message = `live_session_id matches: ${passed}`;

                printResult(
                  "Paused-session attribution",
                  5,
                  passed,
                  "Tip counts while session paused",
                  s5Result.message
                );
              } catch (error) {
                s5Result.passed = false;
                s5Result.message = error.message;
                printResult("Paused-session attribution", 5, false, "Tip attributed", `Error: ${error.message}`);
              }

              // Scenarios 4→5 cleanup (grouped lifecycle)
              if (s4UserId) {
                await cleanupUserFixtures(serviceRoleClient, s4UserId);
                await cleanupTempAuthUser(serviceRoleClient, s4UserId);
              }

              // ========== SCENARIO 6 ==========
              let s6UserId = null;
              let s6AuthClient = null;
              let s6Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s6UserId = tempUser.userId;
                createdAuthUsers.push(s6UserId);
                s6AuthClient = await createAuthenticatedClient(tempUser);

                const startTime = new Date(Date.now() - 120 * 60 * 1000);

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s6UserId,
                    started_at: startTime,
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario6SessionId = sessionData[0].id;

                const pauseTime = new Date(Date.now() - 60 * 60 * 1000);
                const { error: pauseError } = await serviceRoleClient
                  .from("live_sessions")
                  .update({ status: "paused", paused_at: pauseTime })
                  .eq("id", scenario6SessionId);

                if (pauseError) throw pauseError;

                const resumeTime = new Date(Date.now() - 30 * 60 * 1000);
                const { error: resumeError } = await serviceRoleClient
                  .from("live_sessions")
                  .update({
                    status: "active",
                    paused_at: null,
                    total_paused_seconds: 30 * 60
                  })
                  .eq("id", scenario6SessionId);

                if (resumeError) throw resumeError;

                const { data: finalSession, error: finalError } = await s6AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario6SessionId }
                );

                if (finalError) throw finalError;

                const passed = finalSession.status === "ended" && finalSession.paused_at === null;
                s6Result.passed = passed;
                s6Result.message = `status=${finalSession.status}, paused_at=${finalSession.paused_at}`;

                printResult(
                  "Pause → resume → Stop; duration excludes pause",
                  6,
                  passed,
                  "status=ended, paused_at=null, duration correct",
                  s6Result.message
                );
              } catch (error) {
                s6Result.passed = false;
                s6Result.message = error.message;
                printResult("Pause/resume/stop", 6, false, "Pause excluded from duration", `Error: ${error.message}`);
              } finally {
                if (s6UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s6UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s6UserId);
                }
              }

              // ========== SCENARIO 7 ==========
              let s7UserId = null;
              let s7AuthClient = null;
              let s7Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s7UserId = tempUser.userId;
                createdAuthUsers.push(s7UserId);
                s7AuthClient = await createAuthenticatedClient(tempUser);

                const startTime = new Date(Date.now() - 120 * 60 * 1000);

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s7UserId,
                    started_at: startTime,
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario7SessionId = sessionData[0].id;

                const pauseTime = new Date(Date.now() - 30 * 60 * 1000);
                const { error: pauseError } = await serviceRoleClient
                  .from("live_sessions")
                  .update({ status: "paused", paused_at: pauseTime })
                  .eq("id", scenario7SessionId);

                if (pauseError) throw pauseError;

                const { data: finalSession, error: finalError } = await s7AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario7SessionId }
                );

                if (finalError) throw finalError;

                const passed = finalSession.status === "ended" && finalSession.paused_at === null;
                s7Result.passed = passed;
                s7Result.message = `status=${finalSession.status}, paused_at=${finalSession.paused_at}`;

                printResult(
                  "Stop while paused; open pause closes",
                  7,
                  passed,
                  "status=ended, paused_at=null",
                  s7Result.message
                );
              } catch (error) {
                s7Result.passed = false;
                s7Result.message = error.message;
                printResult("Stop while paused", 7, false, "Open pause closes", `Error: ${error.message}`);
              } finally {
                if (s7UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s7UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s7UserId);
                }
              }

              // ========== SCENARIO 8 ==========
              let s8UserId = null;
              let s8AuthClient = null;
              let s8Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s8UserId = tempUser.userId;
                createdAuthUsers.push(s8UserId);
                s8AuthClient = await createAuthenticatedClient(tempUser);

                const startTime = new Date(Date.now() - 60 * 60 * 1000);

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s8UserId,
                    started_at: startTime,
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario8SessionId = sessionData[0].id;

                const tips = [
                  { username: "tipper_a", usd: 5.00, tokens: 500 },
                  { username: "tipper_b", usd: 10.00, tokens: 1000 },
                  { username: "tipper_c", usd: 20.00, tokens: 2000 }
                ];

                for (const tip of tips) {
                  await serviceRoleClient.rpc("persist_extension_tip", {
                    p_user_id: s8UserId,
                    p_client_event_id: generateUUID(),
                    p_deduplication_key: null,
                    p_username: tip.username,
                    p_tokens: tip.tokens,
                    p_usd: tip.usd,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  });
                }

                const { data: finalSession, error: finalError } = await s8AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario8SessionId }
                );

                if (finalError) throw finalError;

                const passed =
                  finalSession.status === "ended" &&
                  finalSession.final_tip_count === 3 &&
                  finalSession.final_total_usd === 35.00 &&
                  finalSession.final_largest_tip_usd === 20.00;

                s8Result.passed = passed;
                s8Result.message = `count=${finalSession.final_tip_count}, total=$${finalSession.final_total_usd}`;

                printResult(
                  "First Stop returns populated final_* metrics",
                  8,
                  passed,
                  "final_tip_count=3, final_total=$35, final_largest=$20",
                  s8Result.message
                );
              } catch (error) {
                s8Result.passed = false;
                s8Result.message = error.message;
                printResult("First Stop metrics", 8, false, "Metrics populated", `Error: ${error.message}`);
              }

              // ========== SCENARIO 9 ==========
              let s9Result = { passed: false, message: "Not executed" };
              try {
                if (!s8UserId || !scenario8SessionId || !s8AuthClient) throw new Error("Scenario 8 setup incomplete");

                const { data: finalSession1, error: finalError1 } = await s8AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario8SessionId }
                );

                if (finalError1) throw finalError1;

                const { data: finalSession2, error: finalError2 } = await s8AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario8SessionId }
                );

                if (finalError2) throw finalError2;

                const passed =
                  finalSession1.finalized_at === finalSession2.finalized_at &&
                  finalSession1.final_tip_count === finalSession2.final_tip_count;

                s9Result.passed = passed;
                s9Result.message = `finalized_at match: ${finalSession1.finalized_at === finalSession2.finalized_at}`;

                printResult(
                  "Repeated Stop is idempotent",
                  9,
                  passed,
                  "finalized_at unchanged, metrics identical",
                  s9Result.message
                );
              } catch (error) {
                s9Result.passed = false;
                s9Result.message = error.message;
                printResult("Repeated Stop idempotent", 9, false, "Idempotent behavior", `Error: ${error.message}`);
              }

              // Scenarios 8→9 cleanup (grouped lifecycle)
              if (s8UserId) {
                await cleanupUserFixtures(serviceRoleClient, s8UserId);
                await cleanupTempAuthUser(serviceRoleClient, s8UserId);
              }

              // ========== SCENARIO 10 ==========
              let s10UserId = null;
              let s10AuthClient = null;
              let s10Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s10UserId = tempUser.userId;
                createdAuthUsers.push(s10UserId);
                s10AuthClient = await createAuthenticatedClient(tempUser);

                const startTime = new Date(Date.now() - 60 * 60 * 1000);

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s10UserId,
                    started_at: startTime,
                    status: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;
                scenario10SessionId = sessionData[0].id;

                const { data: finalSession, error: finalError } = await s10AuthClient.rpc(
                  "finalize_live_session",
                  { p_session_id: scenario10SessionId }
                );

                if (finalError) throw finalError;

                const passed = finalSession.status === "ended" && finalSession.final_tip_count === 0;
                s10Result.passed = passed;
