name: Production Health Check
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  health-check:
    name: Verify Production Accessibility
    runs-on: [self-hosted, Windows, camcash-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only public HTTP checks
        shell: pwsh
        run: node scripts/ci/production-health-check.mjs
