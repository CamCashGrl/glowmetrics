name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glowmetrics_fresh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken JSX comment patterns
        run: |
          echo "Scanning for invalid JSX syntax patterns..."
          if grep -rn "</div>{/\*" app/; then
            echo ""
            echo "❌ BROKEN JSX found — invalid comment after closing div tag"
            echo "Fix: move the comment to its own line inside a parent element"
            exit 1
          fi
          echo "✅ No broken JSX patterns found — safe to deploy"
