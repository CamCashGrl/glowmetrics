name: One-time dashboard entitlement patch

on:
  push:
    branches:
      - codex/free-plan-natural-upgrade-live-limits

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[dashboard-gating-patch]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/free-plan-natural-upgrade-live-limits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glowmetrics_fresh/package-lock.json

      - name: Apply assertion-guarded local entitlement patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page_path = Path('glowmetrics_fresh/app/dashboard/page.js')
          analytics_path = Path('glowmetrics_fresh/lib/analytics.js')
          page = page_path.read_text()
          analytics = analytics_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          page = replace_once(
              page,
              'import { parseCSV, detectPlatform, aggregateRows as runEngine, applyFreeAnalysisWindow, summarizeWindowExclusion, accessibleDataset } from "../../lib/analytics"',
              'import { parseCSV, detectPlatform, aggregateRows as runEngine, summarizeWindowExclusion, accessibleDataset } from "../../lib/analytics"',
              'analytics import',
          )
          page = replace_once(
              page,
              "import { platformLimitMessage, FREE_PLATFORM_LIMIT, resolvePlatformRoles as resolvePlanPlatformRoles } from '../../lib/planLimits'",
              "import { platformLimitMessage, FREE_PLATFORM_LIMIT, resolvePlatformRoles as resolvePlanPlatformRoles, hasPaidProAccess } from '../../lib/planLimits'\nimport { buildCappedAnalyticsDatasets } from '../../lib/freeAnalyticsGate'",
              'plan limits import',
          )
          page = replace_once(
              page,
              ".select('plan, primary_pro_platform, streaming_platforms')",
              ".select('plan, subscription_status, primary_pro_platform, streaming_platforms')",
              'profile entitlement select',
          )

          old_entitlement = """  const isBetaUser = true
          const isPro = profile?.plan === 'pro' || profile?.plan === 'unlimited'
          // Free tier: the primary platform (lib/planLimits.js resolver — onboarding
          // selection only, never inferred from revenue) keeps full history; others
          // keep 31 days. No primary on file → every platform is windowed.
          const freeUnlimitedPlatform = isPro ? null : resolvePlanPlatformRoles(profile?.streaming_platforms, profile?.primary_pro_platform).primary
          const uploadLimit = Infinity

          // Compute windowed tips for free users; windowSummary feeds teaser signal detection
          const analysisTips = isPro ? tips : applyFreeAnalysisWindow(tips, { windowDays: 31, unlimitedPlatform: freeUnlimitedPlatform })
          const windowSummary = summarizeWindowExclusion(tips, analysisTips)
          """
          new_entitlement = """  const isBetaUser = true
          const isPaidPro = hasPaidProAccess({
            plan: profile?.plan,
            subscriptionStatus: profile?.subscription_status,
          })
          // Keep the existing downstream prop name to avoid broad unrelated churn,
          // but its meaning is now strictly paid active Pro (or legacy unlimited).
          const isPro = isPaidPro
          // Free/trial: primary_pro_platform is only the selected platform for detailed
          // analytics. It never grants full history. No selection means no detailed data.
          const selectedAnalyticsPlatform = isPaidPro ? null : resolvePlanPlatformRoles(profile?.streaming_platforms, profile?.primary_pro_platform).primary
          const uploadLimit = Infinity

          // Build the two canonical Free/trial datasets BEFORE detailed calculations.
          const { comparisonTips, detailedAnalysisTips } = isPaidPro
            ? { comparisonTips: tips, detailedAnalysisTips: tips }
            : memoOn(
                derivedCacheRef.current,
                'cappedAnalyticsDatasets',
                [tips, selectedAnalyticsPlatform],
                () => buildCappedAnalyticsDatasets(tips, { selectedAnalyticsPlatform })
              )
          const analysisTips = detailedAnalysisTips
          const windowSummary = summarizeWindowExclusion(tips, comparisonTips)
          """
          page = replace_once(page, old_entitlement, new_entitlement, 'dashboard entitlement block')

          # Rename the stale semantic everywhere it remains. This preserves selection UI
          # while removing the implication that the chosen platform has full history.
          page = page.replace('freeUnlimitedPlatform', 'selectedAnalyticsPlatform')

          page = replace_once(
              page,
              'const gatingRef = useRef({ isPro, unlimited: selectedAnalyticsPlatform })',
              'const gatingRef = useRef({ isPro, selectedPlatform: selectedAnalyticsPlatform })',
              'gating ref init',
          )
          page = replace_once(
              page,
              'gatingRef.current = { isPro, unlimited: selectedAnalyticsPlatform }',
              'gatingRef.current = { isPro, selectedPlatform: selectedAnalyticsPlatform }',
              'gating ref current',
          )
          page = page.replace('gatingRef.current.unlimited', 'gatingRef.current.selectedPlatform')

          replacements = [
              (
                  'const r = runEngine(isPro ? tips : applyFreeAnalysisWindow(tips, { windowDays: 31, unlimitedPlatform: selectedAnalyticsPlatform }), tz)',
                  'const r = runEngine(isPro ? tips : buildCappedAnalyticsDatasets(tips, { selectedAnalyticsPlatform }).detailedAnalysisTips, tz)',
                  'gating rerun engine',
              ),
              (
                  'const analysisTips = gatingRef.current.isPro ? updated : applyFreeAnalysisWindow(updated, { windowDays: 31, unlimitedPlatform: gatingRef.current.selectedPlatform })',
                  'const analysisTips = gatingRef.current.isPro ? updated : buildCappedAnalyticsDatasets(updated, { selectedAnalyticsPlatform: gatingRef.current.selectedPlatform }).detailedAnalysisTips',
                  'realtime engine',
              ),
              (
                  'const analysisTips = gatingRef.current.isPro ? prev : applyFreeAnalysisWindow(prev, { windowDays: 31, unlimitedPlatform: gatingRef.current.selectedPlatform })',
                  'const analysisTips = gatingRef.current.isPro ? prev : buildCappedAnalyticsDatasets(prev, { selectedAnalyticsPlatform: gatingRef.current.selectedPlatform }).detailedAnalysisTips',
                  'refresh engine',
              ),
              (
                  'const analysisTips = gatingRef.current.isPro ? allData : applyFreeAnalysisWindow(allData, { windowDays: 31, unlimitedPlatform: gatingRef.current.selectedPlatform })',
                  'const analysisTips = gatingRef.current.isPro ? allData : buildCappedAnalyticsDatasets(allData, { selectedAnalyticsPlatform: gatingRef.current.selectedPlatform }).detailedAnalysisTips',
                  'initial load engine',
              ),
          ]
          for old, new, label in replacements:
              page = replace_once(page, old, new, label)

          old_accessible = """  const accessible = memoOn(derivedCacheRef.current, 'accessible',
            [tips, paidSessions, livePrivateIntervals, recentShows.shows, isPro, selectedAnalyticsPlatform],
            () => accessibleDataset({
              tips, paidSessions, liveIntervals: livePrivateIntervals, shows: recentShows.shows,
              isPro, unlimitedPlatform: selectedAnalyticsPlatform,
            }))
          """
          new_accessible = """  const accessible = memoOn(derivedCacheRef.current, 'accessible',
            [tips, paidSessions, livePrivateIntervals, recentShows.shows, isPro, selectedAnalyticsPlatform, detailedAnalysisTips],
            () => {
              const recent = accessibleDataset({
                tips, paidSessions, liveIntervals: livePrivateIntervals, shows: recentShows.shows,
                isPro, windowDays: 31,
              })
              if (isPro) return recent
              const selected = selectedAnalyticsPlatform ? canonicalPlatform(selectedAnalyticsPlatform) : null
              const keepSelectedPlatform = (row) => !!selected && canonicalPlatform(row?.platform) === selected
              return {
                ...recent,
                tips: detailedAnalysisTips,
                paidSessions: (recent.paidSessions || []).filter(keepSelectedPlatform),
                liveIntervals: (recent.liveIntervals || []).filter(keepSelectedPlatform),
                shows: (recent.shows || []).filter((show) => {
                  if (!selected) return false
                  const platforms = (show.platformRevenue || []).map((entry) => entry.platform)
                  if (!platforms.length && show.platform) platforms.push(show.platform)
                  return platforms.some((platform) => canonicalPlatform(platform) === selected)
                }),
              }
            })

          const comparisonAnalytics = isPro ? analytics : memoOn(
            derivedCacheRef.current,
            'comparisonAnalytics',
            [comparisonTips],
            () => {
              if (!comparisonTips.length) return null
              let tz = 'UTC'
              try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC' } catch (_) {}
              return runEngine(comparisonTips, tz)
            }
          )
          """
          page = replace_once(page, old_accessible, new_accessible, 'accessible dataset block')

          page = replace_once(
              page,
              '            analytics={analytics}\n            tips={accessible.tips}',
              '            analytics={comparisonAnalytics}\n            tips={comparisonTips}',
              'platform comparison props',
          )

          # The selected platform must never be an unlimited-history escape hatch, even
          # if an older caller still passes the deprecated option. Keep the argument only
          # for backwards compatibility while making it a no-op.
          old_comment = """// Free tier: every platform keeps a rolling `windowDays` (anchored to its own
          // latest row) EXCEPT the creator's primary platform (`unlimitedPlatform`, from
          // lib/planLimits.js resolvePlatformRoles), which keeps its full history.
          // With no primary (null) every platform is windowed — the pre-existing rule.
          // This is the ONLY implementation of Free history gating; everything that
          // shows Free data must go through it (see accessibleDataset below).
          """
          new_comment = """// Free/trial: every platform keeps a rolling `windowDays` anchored to its own
          // latest row. `unlimitedPlatform` is retained only as a backwards-compatible
          // argument name; it is intentionally ignored and can never grant full history.
          // Paid Pro bypasses this helper at the entitlement layer.
          """
          if old_comment in analytics:
              analytics = analytics.replace(old_comment, new_comment, 1)

          unlimited_decl = '  const unlimited = unlimitedPlatform ? canonicalPlatform(unlimitedPlatform) : null\n'
          if analytics.count(unlimited_decl) != 2:
              raise SystemExit(f'analytics unlimited declarations: expected 2, found {analytics.count(unlimited_decl)}')
          analytics = analytics.replace(unlimited_decl, '  void unlimitedPlatform // deprecated compatibility arg; never grants history access\n')
          analytics = replace_once(
              analytics,
              '    if (unlimited && canonicalPlatform(platform) === unlimited) { windowed.push(...sorted); continue }\n',
              '',
              'analysis unlimited bypass',
          )
          analytics = replace_once(
              analytics,
              '    if (unlimited && c === unlimited) return true\n',
              '',
              'accessible unlimited bypass',
          )
          analytics = replace_once(
              analytics,
              '    unlimitedPlatform: unlimited,\n',
              '    unlimitedPlatform: null,\n',
              'accessible deprecated return',
          )

          # Hard safety assertions before touching disk.
          forbidden_page = [
              'freeUnlimitedPlatform',
              'unlimitedPlatform:',
              "profile?.plan === 'pro'",
              'applyFreeAnalysisWindow(',
          ]
          for needle in forbidden_page:
              if needle in page:
                  raise SystemExit(f'page safety check failed; stale pattern remains: {needle}')
          required_page = [
              'subscription_status',
              'hasPaidProAccess({',
              'comparisonTips',
              'detailedAnalysisTips',
              'selectedAnalyticsPlatform',
              'analytics={comparisonAnalytics}',
              'tips={comparisonTips}',
          ]
          for needle in required_page:
              if needle not in page:
                  raise SystemExit(f'page safety check failed; required pattern missing: {needle}')
          if 'if (unlimited &&' in analytics:
              raise SystemExit('analytics safety check failed; unlimited bypass still present')

          page_path.write_text(page)
          analytics_path.write_text(analytics)
          PY

      - name: Verify diff is minimal and intentional
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo '--- DIFF STAT ---'
          git diff --stat
          echo '--- DASHBOARD DIFF ---'
          git diff -- glowmetrics_fresh/app/dashboard/page.js
          echo '--- ANALYTICS GATE DIFF ---'
          git diff -- glowmetrics_fresh/lib/analytics.js
          python3 <<'PY'
          import subprocess
          for path, limit in [
              ('glowmetrics_fresh/app/dashboard/page.js', 220),
              ('glowmetrics_fresh/lib/analytics.js', 60),
          ]:
              raw = subprocess.check_output(['git', 'diff', '--numstat', '--', path], text=True).strip()
              if not raw:
                  raise SystemExit(f'expected a diff for {path}')
              added, deleted, _ = raw.split('\t', 2)
              changed = int(added) + int(deleted)
              print(f'{path}: {added} additions, {deleted} deletions')
              if changed > limit:
                  raise SystemExit(f'{path} diff too large ({changed} > {limit}); refusing to continue')
          PY
          ! grep -n 'freeUnlimitedPlatform\|unlimitedPlatform:' glowmetrics_fresh/app/dashboard/page.js
          ! grep -n "profile?.plan === 'pro'" glowmetrics_fresh/app/dashboard/page.js
          grep -n 'runEngine' glowmetrics_fresh/app/dashboard/page.js

      - name: Install dependencies
        working-directory: glowmetrics_fresh
        run: npm ci

      - name: Targeted entitlement, Live Mode, and upload regressions
        working-directory: glowmetrics_fresh
        run: >-
          npm test -- --runInBand
          lib/__tests__/free-analytics-gate.test.js
          lib/__tests__/free-tier-gating.test.js
          lib/__tests__/plan-limits-free-policy.test.js
          lib/__tests__/live-mode-allowance.test.js
          lib/__tests__/read-upload-json.test.js
          app/api/upload/__tests__/platform-label.test.js
          app/api/stripe/webhook/__tests__/entitlementSync.test.js

      - name: Full test suite
        working-directory: glowmetrics_fresh
        run: npm test -- --runInBand

      - name: Production build
        working-directory: glowmetrics_fresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit verified local patch to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-dashboard-gating-patch.yml
          git add glowmetrics_fresh/app/dashboard/page.js glowmetrics_fresh/lib/analytics.js
          git commit -m 'Fix Free trial dashboard entitlement gating'
          git push origin HEAD:codex/free-plan-natural-upgrade-live-limits
